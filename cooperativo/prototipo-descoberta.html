<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descoberta em N1 · Ilia</title>
<style>
@font-face{font-family:'Marcellus';src:url('../assets/fonts/marcellus.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Cormorant Garamond';src:url('../assets/fonts/cormorant-garamond-italic.woff2') format('woff2');font-weight:300 700;font-style:italic;font-display:swap}
@font-face{font-family:'DM Sans';src:url('../assets/fonts/dm-sans.woff2') format('woff2');font-weight:400 700;font-display:swap}
:root{--bg:#141517;--g2:#26292d;--line:#383c42;--ink:#f1ecde;--muted:#a9adb3;--gold:#e4bd77;--ochre:#d29a4a}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:15px/1.5 'DM Sans',system-ui,sans-serif;overflow:hidden}
/* Fundo: o mapa como está na partida, apagado */
.map{position:fixed;inset:0;background:url('assets/tabuleiro-principal-final.webp') 0% 100%/230% auto no-repeat;filter:brightness(.35) saturate(.8);-webkit-mask:radial-gradient(50% 60% at 30% 70%,#000 50%,#0000 80%);mask:radial-gradient(50% 60% at 30% 70%,#000 50%,#0000 80%)}
.backdrop{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:#0007}
.pop{width:min(460px,100%);max-height:calc(100dvh - 32px);overflow:hidden;display:grid;justify-items:center;gap:10px;text-align:center;padding:20px 22px 22px;border:1px solid #6d5a36;border-radius:12px;background:linear-gradient(160deg,#25272b,#18191b);box-shadow:0 24px 70px #000}
.eyebrow{margin:0;color:var(--ochre);font-size:12px;letter-spacing:.03em}
h2{margin:0;font:400 24px/1.2 Marcellus,serif}
.tale{margin:0;font:italic 500 21px/1.45 'Cormorant Garamond',serif;color:#efe6cf}
.order{width:100%;padding:10px 12px;border-radius:8px;background:var(--g2);font-size:15px}
.order b{color:var(--gold)}
.piece-art{max-width:100%;max-height:min(200px,30dvh);display:block}
.icon{display:grid;place-items:center;width:76px;height:76px;border-radius:50%;background:var(--g2);box-shadow:0 0 0 2px #120c09,0 0 0 4px #b98d4f}
.icon svg{width:38px;height:38px;color:#f0d9a8}
button{font:inherit;cursor:pointer}
.ok{min-height:46px;min-width:180px;margin-top:4px;border:0;border-radius:6px;background:var(--gold);color:#1a1408;font-weight:700}
.mock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;padding:6px 10px;border-radius:999px;background:#000c;border:1px solid #fff2;font-size:13px;color:#ccc;z-index:9}
.mock button{border:0;background:none;color:#ccc;text-decoration:underline}
@media (max-height:520px){.pop{gap:6px;padding:14px 16px}.tale{font-size:18px}}
</style>
<script src="territory.js"></script><script src="piece-art.js"></script><script src="troops.js"></script><script src="heroes.js"></script><script src="landing.js"></script>
</head>
<body>
<div class="map"></div>
<div id="popup"></div>
<div class="mock"><span id="where"></span><button id="restart">Recomeçar</button></div>
<script>
const G=window.TroyLanding,T=G.TOKENS,R=G.REVEAL_TEXT;
const lens='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
// A sequência proposta: a descoberta conta só o achado; cada peça nova é contada uma vez, no próprio encaixe.
const STEPS=[
 {eyebrow:'Descoberta em N1',body:`<h2>${T.N1.hint}</h2><p class="tale">${T.N1.found}</p>`},
 {eyebrow:'Nova peça · 1 de 2',body:`${TroyPieceArt.pieceArt('A2')}<h2>A praia alta</h2><p class="tale">${R.A2}</p><p class="order">Encaixem <b>A2</b> junto a N1.</p>`},
 {eyebrow:'Nova peça · 1 de 2',body:`<span class="icon">${lens}</span><h2>Coloquem 1 ficha de exploração em A2</h2><p>Virada para baixo.</p>`},
 {eyebrow:'Nova peça · 2 de 2',body:`${TroyPieceArt.pieceArt('N2')}<h2>Os destroços</h2><p class="tale">${R.N2}</p><p class="order">Encaixem <b>N2</b> junto a N1 e A2.</p>`},
 {eyebrow:'Nova peça · 2 de 2',body:`<span class="icon">${lens}</span><h2>Coloquem 1 ficha de exploração em N2</h2><p>Virada para baixo.</p>`}];
let i=0;
function render(){const pop=document.getElementById('popup');document.getElementById('where').textContent=i<STEPS.length?`Pop-up ${i+1} de ${STEPS.length}`:'Volta para a partida';
 if(i>=STEPS.length){pop.innerHTML='';return;}
 pop.innerHTML=`<div class="backdrop"><section class="pop" role="dialog" aria-modal="true"><p class="eyebrow">${STEPS[i].eyebrow}</p>${STEPS[i].body}<button class="ok" id="ok">Ok</button></section></div>`;
 TroyPieceArt.hydrate(pop);document.getElementById('ok').onclick=()=>{i++;render();};}
document.getElementById('restart').onclick=()=>{i=0;render();};
render();
</script>
</body>
</html>
