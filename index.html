<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guerra de Troia — Duelo online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14181A; --panel:#1D2224; --parchment:#E7DCC2; --ink:#26211A;
    --gold:#B8935A; --gold-dim:#7A6440;
    --troia:#4C7A6C; --troia-dim:#2E4A41; --troia-light:#A9CBBE;
    --gregos:#9A4235; --gregos-dim:#63241C; --gregos-light:#E3B2A6;
    --cream:#E8E3D3; --muted:#8B8B7E; --error:#C85C4B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:'IBM Plex Sans',sans-serif;padding:28px 20px;max-width:760px;margin:0 auto;}
  h1,h3{font-family:'Cormorant Garamond',serif;}
  h1{font-size:32px;font-weight:600;margin:0 0 4px;color:var(--gold);text-align:center;}
  .subtitle{text-align:center;color:var(--muted);margin:0 0 24px;font-style:italic;font-family:'Cormorant Garamond',serif;font-size:16px;}
  .spear-rule{height:1px;background:linear-gradient(to right,transparent,var(--gold-dim),transparent);margin:16px 0;}
  .setup{text-align:center;padding:16px 0;}
  .setup p{color:var(--muted);line-height:1.6;max-width:520px;margin:0 auto 20px;}
  input.code-input{
    font-family:'IBM Plex Sans',sans-serif;font-size:20px;letter-spacing:4px;text-align:center;text-transform:uppercase;
    padding:12px;border-radius:3px;border:1px solid var(--gold-dim);background:var(--panel);color:var(--cream);width:180px;max-width:100%;
  }
  button.act, button.advance, button.restart, button.wide{
    padding:13px 18px;border-radius:3px;border:1px solid var(--gold-dim);background:var(--panel);color:var(--cream);
    font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s ease;
  }
  button:disabled{opacity:0.5;cursor:default;}
  button.act:hover, button.wide:hover{background:#262C2E;border-color:var(--gold);}
  button.advance{border-color:var(--gold);background:var(--gold-dim);color:#14181A;font-weight:600;}
  button.advance:hover{background:var(--gold);}
  button.wide{width:100%;}
  .pass-screen{text-align:center;padding:60px 20px;}
  .pass-icon{font-size:56px;margin-bottom:18px;}
  .pass-screen h2{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold);margin:0 0 10px;}
  .pass-screen p{color:var(--muted);margin:0 0 26px;}
  .room-code{font-size:34px;letter-spacing:8px;font-weight:600;color:var(--gold);margin:14px 0;font-family:'Cormorant Garamond',serif;}
  .cycle-header{text-align:center;margin-bottom:16px;}
  .cycle-header .label{font-size:13px;color:var(--muted);letter-spacing:0.5px;}
  .cycle-header .phase{font-size:22px;color:var(--gold);font-family:'Cormorant Garamond',serif;font-weight:600;}
  .fronts{display:grid;grid-template-columns:1fr 1px 1fr;gap:18px;margin-bottom:18px;}
  .divider{background:linear-gradient(180deg,transparent,var(--gold-dim),transparent);}
  .front{padding:14px 16px;border-radius:3px;background:var(--panel);}
  .front.troia{border-left:3px solid var(--troia);}
  .front.gregos{border-left:3px solid var(--gregos);}
  .front h3{margin:0 0 10px;font-size:18px;font-weight:600;}
  .front.troia h3{color:var(--troia-light);}
  .front.gregos h3{color:var(--gregos-light);}
  .front.active{outline:1px solid var(--gold);}
  .stat-row{margin-bottom:9px;}
  .stat-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px;}
  .bar-track{height:7px;background:#0F1213;border-radius:2px;overflow:hidden;}
  .bar-fill{height:100%;transition:width .4s ease;}
  .bar-fill.troia{background:var(--troia);}
  .bar-fill.gregos{background:var(--gregos);}
  .small-stats{display:flex;gap:12px;margin-top:10px;font-size:13px;color:var(--cream);flex-wrap:wrap;}
  .small-stats span b{color:var(--muted);font-weight:400;font-size:11px;display:flex;align-items:center;gap:4px;}
  .chronicle-box{background:var(--parchment);color:var(--ink);border-radius:3px;padding:14px 16px;margin-bottom:18px;max-height:210px;overflow-y:auto;}
  .chronicle-box .entry{font-size:15px;line-height:1.5;margin-bottom:9px;font-family:'Cormorant Garamond',serif;}
  .chronicle-box .entry:last-child{margin-bottom:0;}
  .chronicle-box .entry .tag{font-weight:600;}
  .chronicle-box .entry .tag.troia{color:var(--troia-dim);}
  .chronicle-box .entry .tag.gregos{color:var(--gregos-dim);}
  .actions{text-align:center;}
  .action-prompt{font-size:14px;color:var(--muted);margin-bottom:12px;}
  .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .action-grid.three{grid-template-columns:1fr 1fr 1fr;}
  .reveal-box{display:flex;justify-content:space-around;margin-bottom:18px;}
  .reveal-item{text-align:center;}
  .reveal-item .who{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .reveal-item .act-name{font-size:19px;font-family:'Cormorant Garamond',serif;font-weight:600;}
  .reveal-item.troia .act-name{color:var(--troia-light);}
  .reveal-item.gregos .act-name{color:var(--gregos-light);}
  .endgame{text-align:center;padding:16px 0;}
  .endgame h2{font-size:28px;margin:0 0 10px;color:var(--gold);}
  .endgame p{color:var(--muted);max-width:480px;margin:0 auto 18px;line-height:1.6;}
  .era-banner{text-align:center;margin-bottom:14px;}
  .era-banner .tag{font-size:12px;color:var(--muted);letter-spacing:0.5px;}
  .era-banner .title{font-size:24px;color:var(--gold);font-family:'Cormorant Garamond',serif;font-weight:600;}
  .hand{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
  .hand.two{grid-template-columns:repeat(2,1fr);}
  .card{border:1px solid var(--gold-dim);border-radius:4px;padding:14px 12px;cursor:pointer;background:var(--panel);text-align:left;transition:border-color .15s ease, transform .15s ease;}
  .card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .card .kind{font-size:10px;letter-spacing:0.6px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
  .card .name{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--cream);margin-bottom:6px;}
  .card .effect{font-size:12px;color:var(--muted);line-height:1.4;}
  .role-pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;letter-spacing:0.4px;margin-bottom:10px;}
  .role-pill.troia{background:var(--troia-dim);color:var(--troia-light);}
  .role-pill.gregos{background:var(--gregos-dim);color:var(--gregos-light);}
  .error-banner{background:var(--error);color:#fff;padding:10px 14px;border-radius:3px;font-size:13px;margin-bottom:16px;text-align:center;}
  .share-hint{font-size:13px;color:var(--muted);margin-top:8px;}
  .divider-or{color:var(--muted);font-size:12px;margin:18px 0;text-align:center;}
</style>
</head>
<body>
<h1>Guerra de Troia</h1>
<p class="subtitle">duelo online — cada jogador no seu próprio aparelho</p>
<div class="spear-rule"></div>
<div id="app"></div>
<script>
const API = '/.netlify/functions/room';
const KIND_ICON = {
  'Construção':'🏛️','Recurso':'🍎','Recrutamento':'⚔️','Sabedoria':'📜',
  'Equipamento':'🔥','Armadilha':'🕳️','Favor divino':'✨','Ritual':'🌊','Estratégia':'🧭'
};
const ACTION_LABEL = {atacar:'Atacar', reforcar:'Reforçar', buscar:'Buscar recursos', estratagema:'Estratagema'};

let session = null; // {code, role, token}
let view = null;
let localScreen = 'intro'; // intro | create | join | game
let errorMsg = null;
let pollTimer = null;

function loadSession(){
  try {
    const raw = localStorage.getItem('troia-session');
    if(raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}
function saveSession(s){
  try { localStorage.setItem('troia-session', JSON.stringify(s)); } catch(e) {}
}
function clearSession(){
  try { localStorage.removeItem('troia-session'); } catch(e) {}
}

async function api(action, opts){
  opts = opts || {};
  const method = opts.method || 'GET';
  let url = API + '?action=' + encodeURIComponent(action);
  const fetchOpts = { method };
  if(method === 'GET'){
    const qs = new URLSearchParams(opts.params || {});
    url += '&' + qs.toString();
  } else {
    fetchOpts.headers = {'Content-Type':'application/json'};
    fetchOpts.body = JSON.stringify(opts.body || {});
  }
  const res = await fetch(url, fetchOpts);
  const data = await res.json().catch(()=>({error:'Resposta inválida do servidor.'}));
  if(!res.ok) throw new Error(data.error || 'Erro na requisição.');
  return data;
}

async function refreshState(){
  if(!session) return;
  try {
    const data = await api('state', { params:{ code:session.code, role:session.role, token:session.token } });
    view = data;
    errorMsg = null;
    render();
  } catch(e){
    errorMsg = e.message;
    render();
  }
}

function startPolling(){
  stopPolling();
  pollTimer = setInterval(refreshState, 1800);
  refreshState();
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}

async function criarSala(){
  errorMsg = null;
  try {
    const data = await api('create', { method:'POST', body:{} });
    session = { code:data.code, role:data.role, token:data.token };
    saveSession(session);
    localScreen = 'game';
    startPolling();
  } catch(e){ errorMsg = e.message; render(); }
}

async function entrarSala(code){
  errorMsg = null;
  try {
    const data = await api('join', { method:'POST', body:{ code } });
    session = { code:data.code, role:data.role, token:data.token };
    saveSession(session);
    localScreen = 'game';
    startPolling();
  } catch(e){ errorMsg = e.message; render(); }
}

async function sairSala(){
  stopPolling();
  session = null; view = null; errorMsg = null;
  clearSession();
  localScreen = 'intro';
  render();
}

async function iniciarDuelo(){
  try { await api('start', { method:'POST', body: session }); refreshState(); }
  catch(e){ errorMsg = e.message; render(); }
}
async function escolherCartaEra(idx){
  try { await api('pick-era', { method:'POST', body: Object.assign({index:idx}, session) }); refreshState(); }
  catch(e){ errorMsg = e.message; render(); }
}
async function continuarEra(){
  try { await api('advance-era', { method:'POST', body: session }); refreshState(); }
  catch(e){ errorMsg = e.message; render(); }
}
async function escolherAcao(choice){
  try { await api('pick-action', { method:'POST', body: Object.assign({choice}, session) }); refreshState(); }
  catch(e){ errorMsg = e.message; render(); }
}
async function resolverCiclo(){
  try { await api('resolve-cycle', { method:'POST', body: session }); refreshState(); }
  catch(e){ errorMsg = e.message; render(); }
}
async function novoDuelo(){
  try { await api('restart', { method:'POST', body: session }); refreshState(); }
  catch(e){ errorMsg = e.message; render(); }
}

function statsHTML(){
  const s = view.siege;
  if(!s) return '';
  return `
  <div class="fronts">
    <div class="front troia ${view.role==='troia' && view.phase==='siege-pick' && !view.picked ? 'active':''}">
      <h3>🏛️ Troia</h3>
      <div class="stat-row">
        <div class="stat-label"><span>Tropas</span><span>${s.tropasTroia}/${s.tropasTroiaMax||'-'}</span></div>
        <div class="bar-track"><div class="bar-fill troia" style="width:${s.tropasTroiaMax? s.tropasTroia/s.tropasTroiaMax*100:0}%"></div></div>
      </div>
      <div class="small-stats">
        <span><b>🍎 Suprimento</b>${s.suprimentoTroia}</span>
        <span><b>🏰 Resistência</b>${s.resistenciaEstrutural||0}</span>
      </div>
    </div>
    <div class="divider"></div>
    <div class="front gregos ${view.role==='gregos' && view.phase==='siege-pick' && !view.picked ? 'active':''}">
      <h3>⛺ Gregos</h3>
      <div class="stat-row">
        <div class="stat-label"><span>Determinação</span><span>${s.determinacao}/${s.determinacaoMax||16}</span></div>
        <div class="bar-track"><div class="bar-fill gregos" style="width:${s.determinacaoMax? s.determinacao/s.determinacaoMax*100:0}%"></div></div>
      </div>
      <div class="small-stats">
        <span><b>⚔️ Tropas</b>${s.tropasGregos}</span>
        <span><b>🍎 Suprimento</b>${s.suprimentoGregos}</span>
        <span><b>🔥 Ataque</b>+${s.bonusAtaqueGregos}</span>
      </div>
    </div>
  </div>`;
}

function chronicleHTML(){
  const s = view.siege;
  if(!s || !s.log || s.log.length===0) return '';
  return `<div class="chronicle-box">${s.log.map(e=>`<div class="entry">${e.html}</div>`).join('')}</div>`;
}

function errorHTML(){
  return errorMsg ? `<div class="error-banner">${errorMsg}</div>` : '';
}

function render(){
  const app = document.getElementById('app');

  if(localScreen === 'intro'){
    app.innerHTML = `
      ${errorHTML()}
      <div class="setup">
        <p>Cada jogador entra pelo próprio celular ou computador — não precisa mais revezar o mesmo aparelho.
        Um dos lados cria a sala e manda o código pro outro entrar.</p>
        <button class="advance wide" style="max-width:280px;margin:0 auto;" onclick="window._go('create')">Criar sala</button>
        <div class="divider-or">ou</div>
        <button class="wide" style="max-width:280px;margin:0 auto;" onclick="window._go('join')">Entrar com um código</button>
      </div>`;
    return;
  }

  if(localScreen === 'create'){
    app.innerHTML = `
      ${errorHTML()}
      <div class="setup">
        <p>Você vai jogar como <b>Troia</b>. Clique abaixo pra gerar o código da sala e compartilhar com quem vai jogar dos Gregos.</p>
        <button class="advance wide" style="max-width:280px;margin:0 auto;" onclick="criarSala()">Gerar código da sala</button>
        <p class="share-hint"><a href="#" onclick="window._go('intro');return false;" style="color:var(--muted);">voltar</a></p>
      </div>`;
    return;
  }

  if(localScreen === 'join'){
    app.innerHTML = `
      ${errorHTML()}
      <div class="setup">
        <p>Você vai jogar como os <b>Gregos</b>. Digite o código de 5 letras que o outro jogador te passou.</p>
        <input class="code-input" id="join-code" maxlength="5" placeholder="XXXXX" autofocus>
        <div style="margin-top:16px;">
          <button class="advance" onclick="window._joinFromInput()">Entrar na sala</button>
        </div>
        <p class="share-hint"><a href="#" onclick="window._go('intro');return false;" style="color:var(--muted);">voltar</a></p>
      </div>`;
    return;
  }

  if(localScreen === 'game'){
    if(!view){
      app.innerHTML = `${errorHTML()}<div class="setup"><p>Carregando sala...</p></div>`;
      return;
    }
    renderGame(app);
    return;
  }
}

function renderGame(app){
  const v = view;

  if(v.phase === 'lobby'){
    app.innerHTML = `
      ${errorHTML()}
      <div class="pass-screen">
        <div class="pass-icon">${v.role==='troia'?'🏛️':'⛺'}</div>
        <h2>Sala ${v.code}</h2>
        <div class="role-pill ${v.role}">Você é ${v.role==='troia'?'Troia':'os Gregos'}</div>
        ${v.roomFull
          ? `<p>Os dois lados estão prontos.</p><button class="advance" onclick="iniciarDuelo()">Começar duelo</button>`
          : `<div class="room-code">${v.code}</div><p>Compartilhe esse código com o outro jogador. Aguardando ele entrar...</p>`}
        <p class="share-hint"><a href="#" onclick="sairSala();return false;" style="color:var(--muted);">sair da sala</a></p>
      </div>`;
    return;
  }

  if(v.phase === 'era-pick'){
    if(v.picked){
      app.innerHTML = `
        ${errorHTML()}
        <span class="role-pill ${v.role}">Você é ${v.role==='troia'?'Troia':'os Gregos'}</span>
        <div class="era-banner">
          <div class="tag">Rodada ${v.eraRound} de ${v.eraRoundsTotal}</div>
          <div class="title">${v.eraStage==='era1' ? 'Era I — Preparação' : 'Era II — Travessia'}</div>
        </div>
        <div class="pass-screen" style="padding:30px 20px;">
          <p>Carta escolhida. Aguardando o adversário decidir a dele...</p>
        </div>`;
      return;
    }
    const handClass = v.myHand.length===2 ? 'hand two' : 'hand';
    app.innerHTML = `
      ${errorHTML()}
      <span class="role-pill ${v.role}">Você é ${v.role==='troia'?'Troia':'os Gregos'}</span>
      <div class="era-banner">
        <div class="tag">Rodada ${v.eraRound} de ${v.eraRoundsTotal}</div>
        <div class="title">${v.eraStage==='era1' ? 'Era I — Preparação' : 'Era II — Travessia'}</div>
      </div>
      <div class="actions">
        <div class="action-prompt">Escolha uma carta desta rodada:</div>
        <div class="${handClass}">
          ${v.myHand.map((c,i)=>`
            <div class="card" onclick="escolherCartaEra(${i})">
              <div class="kind">${KIND_ICON[c.kind]||''} ${c.kind}</div>
              <div class="name">${c.name}</div>
              <div class="effect">${c.effect}</div>
            </div>`).join('')}
        </div>
      </div>`;
    return;
  }

  if(v.phase === 'era-reveal'){
    const rv = v.reveal;
    app.innerHTML = `
      ${errorHTML()}
      <div class="era-banner">
        <div class="tag">Rodada ${v.eraRound} de ${v.eraRoundsTotal}</div>
        <div class="title">${v.eraStage==='era1' ? 'Era I — Preparação' : 'Era II — Travessia'}</div>
      </div>
      <div class="reveal-box">
        <div class="reveal-item troia"><div class="who">Troia</div><div class="act-name">${rv.troia.name}</div></div>
        <div class="reveal-item gregos"><div class="who">Gregos</div><div class="act-name">${rv.gregos.name}</div></div>
      </div>
      <div style="text-align:center;"><button class="advance" onclick="continuarEra()">Continuar</button></div>
    `;
    return;
  }

  if(v.phase === 'siege-pick'){
    if(v.picked){
      app.innerHTML = `
        ${errorHTML()}
        <div class="cycle-header"><div class="label">Cerco — ciclo ${v.siege.cycle}</div><div class="phase">Fase de planejamento</div></div>
        ${statsHTML()}
        ${chronicleHTML()}
        <div class="pass-screen" style="padding:20px;">
          <p>Ação escolhida. Aguardando o adversário...</p>
        </div>`;
      return;
    }
    const actions = v.actions;
    app.innerHTML = `
      ${errorHTML()}
      <span class="role-pill ${v.role}">Você é ${v.role==='troia'?'Troia':'os Gregos'}</span>
      <div class="cycle-header"><div class="label">Cerco — ciclo ${v.siege.cycle}</div><div class="phase">Fase de planejamento</div></div>
      ${statsHTML()}
      ${chronicleHTML()}
      <div class="actions">
        <div class="action-prompt">Escolha sua ação deste ciclo:</div>
        <div class="action-grid ${actions.length===3?'three':''}">
          ${actions.map(a=>`<button class="act" onclick="escolherAcao('${a}')">${ACTION_LABEL[a]}</button>`).join('')}
        </div>
      </div>`;
    return;
  }

  if(v.phase === 'siege-reveal'){
    const la = v.lastActions;
    app.innerHTML = `
      ${errorHTML()}
      <div class="cycle-header"><div class="label">Cerco — ciclo ${v.siege.cycle}</div><div class="phase">Revelação</div></div>
      ${statsHTML()}
      <div class="reveal-box">
        <div class="reveal-item troia"><div class="who">Troia</div><div class="act-name">${ACTION_LABEL[la.troia]}</div></div>
        <div class="reveal-item gregos"><div class="who">Gregos</div><div class="act-name">${ACTION_LABEL[la.gregos]}</div></div>
      </div>
      <div style="text-align:center;"><button class="advance" onclick="resolverCiclo()">Resolver o ciclo</button></div>
    `;
    return;
  }

  if(v.phase === 'fim'){
    const venceu = v.siege.gameOver;
    const textos = {
      tropas: venceu==='troia' ? 'O exército grego se dissolveu por completo — sem homens, o cerco não pode continuar.' : 'A guarnição de Troia foi reduzida a nada — a cidade não tem mais quem a defenda.',
      moral: 'Sem vitórias suficientes para justificar mais um ano longe de casa, o acampamento grego se desfaz.'
    };
    app.innerHTML = `
      ${errorHTML()}
      <div class="cycle-header"><div class="label">Ciclo ${v.siege.cycle} — fim do cerco</div></div>
      ${statsHTML()}
      ${chronicleHTML()}
      <div class="endgame">
        <h2>${venceu==='troia' ? 'Troia resiste' : 'O cerco vence'}</h2>
        <p>${textos[v.siege.reason]||''}</p>
        <button class="restart" onclick="novoDuelo()">Novo duelo</button>
      </div>`;
    return;
  }
}

window._go = function(screen){ errorMsg = null; localScreen = screen; render(); };
window._joinFromInput = function(){
  const input = document.getElementById('join-code');
  const code = (input.value || '').trim();
  if(!code){ errorMsg = 'Digite o código da sala.'; render(); return; }
  entrarSala(code);
};

(function init(){
  const saved = loadSession();
  if(saved){
    session = saved;
    localScreen = 'game';
    startPolling();
  } else {
    render();
  }
})();
</script>
