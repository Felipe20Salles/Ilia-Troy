<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guerra de Troia — Duelo online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14181A; --panel:#1D2224; --parchment:#E7DCC2; --ink:#26211A;
    --gold:#B8935A; --gold-dim:#7A6440;
    --troia:#4C7A6C; --troia-dim:#2E4A41; --troia-light:#A9CBBE;
    --gregos:#9A4235; --gregos-dim:#63241C; --gregos-light:#E3B2A6;
    --cream:#E8E3D3; --muted:#8B8B7E; --error:#C85C4B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:'IBM Plex Sans',sans-serif;padding:28px 20px;max-width:1180px;margin:0 auto;}
  h1,h3{font-family:'Cormorant Garamond',serif;}
  h1{font-size:32px;font-weight:600;margin:0 0 4px;color:var(--gold);text-align:center;}
  .subtitle{text-align:center;color:var(--muted);margin:0 0 24px;font-style:italic;font-family:'Cormorant Garamond',serif;font-size:16px;}
  .spear-rule{height:1px;background:linear-gradient(to right,transparent,var(--gold-dim),transparent);margin:16px 0;}
  .setup{text-align:center;padding:16px 0;}
  .setup p{color:var(--muted);line-height:1.6;max-width:520px;margin:0 auto 20px;}
  input.code-input{
    font-family:'IBM Plex Sans',sans-serif;font-size:20px;letter-spacing:4px;text-align:center;text-transform:uppercase;
    padding:12px;border-radius:3px;border:1px solid var(--gold-dim);background:var(--panel);color:var(--cream);width:180px;max-width:100%;
  }
  button.act, button.advance, button.restart, button.wide{
    padding:13px 18px;border-radius:3px;border:1px solid var(--gold-dim);background:var(--panel);color:var(--cream);
    font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s ease;
  }
  button:disabled{opacity:0.5;cursor:default;}
  button.act:hover, button.wide:hover{background:#262C2E;border-color:var(--gold);}
  button.advance{border-color:var(--gold);background:var(--gold-dim);color:#14181A;font-weight:600;}
  button.advance:hover{background:var(--gold);}
  button.wide{width:100%;}
  .pass-screen{text-align:center;padding:60px 20px;}
  .pass-icon{font-size:56px;margin-bottom:18px;}
  .pass-screen h2{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold);margin:0 0 10px;}
  .pass-screen p{color:var(--muted);margin:0 0 26px;}
  .room-code{font-size:34px;letter-spacing:8px;font-weight:600;color:var(--gold);margin:14px 0;font-family:'Cormorant Garamond',serif;}
  .cycle-header{text-align:center;margin-bottom:16px;}
  .cycle-header .label{font-size:13px;color:var(--muted);letter-spacing:0.5px;}
  .cycle-header .phase{font-size:22px;color:var(--gold);font-family:'Cormorant Garamond',serif;font-weight:600;}
  .fronts{display:grid;grid-template-columns:1fr 1px 1fr;gap:18px;margin-bottom:18px;}
  .divider{background:linear-gradient(180deg,transparent,var(--gold-dim),transparent);}
  .front{padding:14px 16px;border-radius:3px;background:var(--panel);}
  .front.troia{border-left:3px solid var(--troia);}
  .front.gregos{border-left:3px solid var(--gregos);}
  .front h3{margin:0 0 10px;font-size:18px;font-weight:600;}
  .front.troia h3{color:var(--troia-light);}
  .front.gregos h3{color:var(--gregos-light);}
  .front.active{outline:1px solid var(--gold);}
  .stat-row{margin-bottom:9px;}
  .stat-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px;}
  .bar-track{height:7px;background:#0F1213;border-radius:2px;overflow:hidden;}
  .bar-fill{height:100%;transition:width .4s ease;}
  .bar-fill.troia{background:var(--troia);}
  .bar-fill.gregos{background:var(--gregos);}
  .small-stats{display:flex;gap:12px;margin-top:10px;font-size:13px;color:var(--cream);flex-wrap:wrap;}
  .small-stats span b{color:var(--muted);font-weight:400;font-size:11px;display:flex;align-items:center;gap:4px;}
  .chronicle-box{background:var(--parchment);color:var(--ink);border-radius:3px;padding:14px 16px;margin-bottom:18px;max-height:210px;overflow-y:auto;}
  .chronicle-box .entry{font-size:15px;line-height:1.5;margin-bottom:9px;font-family:'Cormorant Garamond',serif;}
  .chronicle-box .entry:last-child{margin-bottom:0;}
  .chronicle-box .entry .tag{font-weight:600;}
  .chronicle-box .entry .tag.troia{color:var(--troia-dim);}
  .chronicle-box .entry .tag.gregos{color:var(--gregos-dim);}
  .actions{text-align:center;}
  .action-prompt{font-size:14px;color:var(--muted);margin-bottom:12px;}
  .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .action-grid.three{grid-template-columns:1fr 1fr 1fr;}
  .reveal-box{display:flex;justify-content:space-around;margin-bottom:18px;}
  .reveal-item{text-align:center;}
  .reveal-item .who{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .reveal-item .act-name{font-size:19px;font-family:'Cormorant Garamond',serif;font-weight:600;}
  .reveal-item.troia .act-name{color:var(--troia-light);}
  .reveal-item.gregos .act-name{color:var(--gregos-light);}
  .endgame{text-align:center;padding:16px 0;}
  .endgame h2{font-size:28px;margin:0 0 10px;color:var(--gold);}
  .endgame p{color:var(--muted);max-width:480px;margin:0 auto 18px;line-height:1.6;}
  .era-banner{text-align:center;margin-bottom:14px;}
  .era-banner .tag{font-size:12px;color:var(--muted);letter-spacing:0.5px;}
  .era-banner .title{font-size:24px;color:var(--gold);font-family:'Cormorant Garamond',serif;font-weight:600;}
  .hand{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
  .hand.two{grid-template-columns:repeat(2,1fr);}
  .card{border:1px solid var(--gold-dim);border-radius:4px;padding:14px 12px;cursor:pointer;background:var(--panel);text-align:left;transition:border-color .15s ease, transform .15s ease;}
  .card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .card.selected{border-color:var(--gold);background:#29271f;transform:translateY(-2px);box-shadow:0 0 0 1px var(--gold);}
  .card.busy{pointer-events:none;opacity:.55;}
  .card .kind{font-size:10px;letter-spacing:0.6px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
  .card .name{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--cream);margin-bottom:6px;}
  .card .effect{font-size:12px;color:var(--muted);line-height:1.4;}
  .role-pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;letter-spacing:0.4px;margin-bottom:10px;}
  .role-pill.troia{background:var(--troia-dim);color:var(--troia-light);}
  .role-pill.gregos{background:var(--gregos-dim);color:var(--gregos-light);}
  .error-banner{background:var(--error);color:#fff;padding:10px 14px;border-radius:3px;font-size:13px;margin-bottom:16px;text-align:center;}
  .share-hint{font-size:13px;color:var(--muted);margin-top:8px;}
  .divider-or{color:var(--muted);font-size:12px;margin:18px 0;text-align:center;}
  .quick-manual{margin:24px auto 0;max-width:640px;text-align:left;border:1px solid var(--gold-dim);border-radius:4px;background:rgba(29,34,36,.72);overflow:hidden;}
  .quick-manual summary{list-style:none;cursor:pointer;padding:13px 16px;color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;}
  .quick-manual summary::-webkit-details-marker{display:none;}
  .quick-manual summary:after{content:'+';float:right;font-family:'IBM Plex Sans',sans-serif;color:var(--muted);}
  .quick-manual[open] summary:after{content:'−';}
  .manual-body{border-top:1px solid var(--gold-dim);padding:14px 16px 16px;color:var(--cream);}
  .manual-body h3{font-size:17px;margin:14px 0 6px;color:var(--gold);}
  .manual-body h3:first-child{margin-top:0;}
  .manual-body p{margin:0 0 8px;max-width:none;color:var(--muted);line-height:1.55;}
  .manual-list{margin:0;padding-left:18px;color:var(--muted);font-size:14px;line-height:1.55;}
  .manual-list li{margin-bottom:6px;}
  .manual-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0;}
  .manual-side{border-left:3px solid var(--gold-dim);padding:8px 10px;background:#171B1D;}
  .manual-side.troia{border-left-color:var(--troia);}
  .manual-side.gregos{border-left-color:var(--gregos);}
  .manual-side b{display:block;margin-bottom:4px;color:var(--cream);}
  .manual-side span{display:block;color:var(--muted);font-size:13px;line-height:1.45;}
  .battle-map{margin-bottom:18px;}
  .battle-map-title{text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px;letter-spacing:0.4px;}
  .battle-map-row{display:flex;align-items:center;justify-content:center;gap:4px;}
  .battle-map-row.board-view{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"muralhas portoes" "planicie acampamento";gap:8px;max-width:520px;margin:0 auto;}
  .battle-node{flex:1;max-width:150px;text-align:center;padding:10px 6px;border-radius:3px;background:var(--panel);border:1px solid var(--gold-dim);opacity:0.55;transition:opacity .2s ease, border-color .2s ease;}
  .battle-map-row.board-view .battle-node{max-width:none;min-height:82px;display:flex;flex-direction:column;justify-content:center;}
  .battle-node.active{opacity:1;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
  .battle-node-icon{font-size:22px;margin-bottom:4px;}
  .battle-node-label{font-size:10px;color:var(--cream);line-height:1.3;}
  .battle-node-arrow{color:var(--muted);font-size:12px;}
  .battle-map-hint{text-align:center;font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5;}
  .siege-board{margin-bottom:18px;}
  .defense-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
  .defense-tile{background:var(--panel);border:1px solid var(--gold-dim);border-radius:3px;padding:9px 8px;min-height:76px;}
  .defense-tile.inactive{opacity:.42;}
  .defense-tile.broken{border-color:var(--gregos);background:#261D1B;}
  .defense-name{font-size:12px;color:var(--cream);font-weight:600;margin-bottom:6px;}
  .pressure-dots{display:flex;gap:4px;min-height:9px;margin-bottom:5px;}
  .pressure-dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--gold-dim);background:transparent;}
  .pressure-dot.filled{background:var(--gold);}
  .defense-note{font-size:10px;color:var(--muted);line-height:1.3;}
  .chronicle-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px;}
  .chron-btn{background:none;border:1px solid var(--gold-dim);color:var(--ink);border-radius:3px;width:28px;height:28px;cursor:pointer;font-size:14px;line-height:1;padding:0;}
  .chron-btn:disabled{opacity:0.3;cursor:default;}
  .chron-cycle{font-size:12px;font-weight:600;letter-spacing:0.3px;}
  .resources-title{text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px;}
  .intro-video-overlay{position:fixed;inset:0;z-index:20;background:#070909;display:flex;align-items:center;justify-content:center;padding:20px;}
  .intro-video-panel{width:min(920px,100%);text-align:center;}
  .intro-video-panel video{width:100%;max-height:78vh;border:1px solid var(--gold-dim);background:#000;}
  .intro-video-actions{display:flex;justify-content:center;gap:10px;margin-top:12px;}
  .intro-slide{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--gold-dim);background:#000;overflow:hidden;}
  .intro-slide img{width:100%;height:100%;object-fit:contain;display:block;}
  .intro-slide-caption{position:absolute;left:0;right:0;bottom:0;padding:28px 18px 16px;background:linear-gradient(transparent,rgba(0,0,0,.88));font-family:'Cormorant Garamond',serif;font-size:22px;color:#fff;}
  .intro-progress{display:flex;justify-content:center;gap:7px;margin-top:12px;}
  .intro-progress span{width:26px;height:3px;background:#444;}
  .intro-progress span.active{background:var(--gold);}
  body.playing{height:100dvh;max-width:none;padding:0 12px 12px;overflow:hidden;}
  body.playing>h1{height:34px;margin:0;padding-top:6px;font-size:20px;line-height:28px;}
  body.playing>.subtitle{display:none;}
  body.playing>.spear-rule{margin:0 0 8px;}
  body.playing>#app{height:calc(100dvh - 43px);min-height:0;}
  .table-shell{height:100%;display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,23vw,360px);gap:10px;min-height:0;}
  .table-stage{min-width:0;min-height:0;display:grid;place-items:center;overflow:hidden;background:#0b0e0f;border:1px solid #312b20;}
  .campaign-board{container-type:inline-size;position:relative;width:min(100%,calc((100dvh - 43px) * 1.5));max-height:100%;aspect-ratio:3/2;margin:0;overflow:hidden;background:#0b0e0f;isolation:isolate;box-shadow:0 10px 32px rgba(0,0,0,.34);}
  .campaign-board>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:0;}
  .campaign-board>*:not(img){z-index:2;}
  .campaign-board:after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 24px rgba(0,0,0,.4);}
  .board-zone-focus{position:absolute;opacity:0;pointer-events:none;border:2px solid #f0cf87;box-shadow:0 0 20px rgba(240,207,135,.6);transition:opacity .16s ease;}
  .board-zone-focus.gregos{left:4%;top:25%;width:28%;height:47%;}.board-zone-focus.troia{right:3%;top:24%;width:36%;height:48%;}.board-zone-focus.defesas{left:56.5%;top:56%;width:28%;height:16%;}
  .campaign-board[data-focus="gregos"] .board-zone-focus.gregos,.campaign-board[data-focus="troia"] .board-zone-focus.troia,.campaign-board[data-focus="defesas"] .board-zone-focus.defesas{opacity:1;}
  .board-track{position:absolute;display:grid;grid-template-columns:repeat(9,1fr);align-items:center;gap:1.6%;height:4.8%;}
  .board-track.greek-troops{left:15.3%;top:5.4%;width:23%;}.board-track.troy-troops{left:61.5%;top:5.4%;width:23%;}
  .board-track.greek-morale{left:15.5%;top:79.2%;width:21.2%;}.board-track.troy-supply{left:69.2%;top:79.2%;width:21.4%;}
  .track-pip{width:100%;aspect-ratio:1;border-radius:50%;background:transparent;transition:background .25s ease,box-shadow .25s ease;}
  .board-track.greek-troops .track-pip.on,.board-track.greek-morale .track-pip.on{background:rgba(154,66,53,.86);box-shadow:inset 0 0 0 1px #e3b2a6,0 0 7px rgba(154,66,53,.72);}
  .board-track.troy-troops .track-pip.on,.board-track.troy-supply .track-pip.on{background:rgba(35,112,119,.88);box-shadow:inset 0 0 0 1px #a9cbbe,0 0 7px rgba(35,112,119,.72);}
  .track-count{position:absolute;min-width:4.2%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:rgba(8,11,11,.92);border:1px solid var(--gold);font-size:clamp(8px,1.25cqw,15px);font-weight:600;color:#fff;box-shadow:0 2px 7px rgba(0,0,0,.5);}
  .track-count.greek-troops{left:11.7%;top:5.4%;}.track-count.troy-troops{right:11.7%;top:5.4%;}
  .track-count.greek-morale{left:11.8%;top:79.1%;}.track-count.troy-supply{right:5.1%;top:79.1%;}
  .board-metric{position:absolute;min-width:3.7%;height:3.2%;display:grid;place-items:center;background:rgba(8,11,11,.9);border:1px solid rgba(184,147,90,.8);font-size:clamp(7px,.95cqw,11px);font-weight:600;color:#fff;line-height:1;}
  .board-metric.greek-attack{left:16.6%;top:18.3%;}.board-metric.greek-supply{left:22.1%;top:18.3%;}.board-metric.greek-consumption{left:27.6%;top:18.3%;}
  .board-metric.troy-attack{left:65.1%;top:18.3%;}.board-metric.troy-supply{left:70.6%;top:18.3%;}.board-metric.troy-consumption{left:76.2%;top:18.3%;}.board-metric.troy-defense{left:81.7%;top:18.3%;}
  .board-defense-markers{position:absolute;left:57.7%;top:57.7%;width:25.5%;height:12.5%;display:grid;grid-template-columns:repeat(4,1fr);gap:2.4%;}
  .board-defense-marker{position:relative;border:2px solid transparent;background:rgba(4,7,7,.55);transition:opacity .2s ease,border-color .2s ease,box-shadow .2s ease;}
  .board-defense-marker:after{content:'×';position:absolute;inset:0;display:grid;place-items:center;color:rgba(232,227,211,.55);font-size:clamp(13px,2.1cqw,25px);}
  .board-defense-marker.active{background:rgba(76,122,108,.17);border-color:#d2b475;box-shadow:0 0 9px rgba(210,180,117,.5);}
  .board-defense-marker.active:after{content:'';}
  .board-defense-marker.broken{background:rgba(99,36,28,.65);border-color:var(--gregos);}
  .board-defense-marker.broken:after{content:'×';color:#fff;}
  .defense-pressure{position:absolute;left:12%;right:12%;bottom:7%;display:flex;justify-content:center;gap:6%;}
  .defense-pressure i{width:14%;aspect-ratio:1;border-radius:50%;border:1px solid var(--gold);background:#17191a;}
  .defense-pressure i.on{background:var(--gold);}
  .army-marker{position:absolute;width:4.1%;aspect-ratio:1;border-radius:50%;background:var(--gregos-dim);border:2px solid #e5c078;display:grid;place-items:center;font-size:clamp(9px,1.55cqw,18px);box-shadow:0 0 0 3px rgba(0,0,0,.4),0 0 12px rgba(229,192,120,.55);transition:left .45s ease,top .45s ease;transform:translate(-50%,-50%);}
  .army-marker.acampamento{left:18%;top:51.5%;}.army-marker.planicie{left:45%;top:51.5%;}.army-marker.muralhas{left:68%;top:51.5%;}.army-marker.portoes{left:89%;top:51.5%;}
  .season-marker{position:absolute;top:78.2%;width:5.2%;aspect-ratio:1;border-radius:50%;border:2px solid #f0cf87;box-shadow:0 0 12px rgba(240,207,135,.8);pointer-events:none;}
  .season-marker.primavera{left:40.3%;}.season-marker.verao{left:46.3%;}.season-marker.outono{left:52.2%;}.season-marker.inverno{left:58.1%;}
  .command-panel{min-width:0;height:100%;display:flex;flex-direction:column;background:#181d1f;border:1px solid var(--gold-dim);overflow:hidden;}
  .command-header{padding:12px 14px 10px;border-bottom:1px solid #393329;background:#15191b;}
  .command-topline{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .command-kicker{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;}
  .command-title{margin:3px 0 0;color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:22px;line-height:1.05;}
  .icon-button{width:34px;height:34px;padding:0;border:1px solid var(--gold-dim);background:#202628;color:var(--cream);cursor:pointer;font-weight:600;}
  .command-tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #393329;}
  .command-tabs button{height:36px;border:0;border-right:1px solid #393329;background:#161b1d;color:var(--muted);font-size:11px;cursor:pointer;}
  .command-tabs button:last-child{border-right:0}.command-tabs button.active{color:var(--gold);background:#222729;box-shadow:inset 0 -2px var(--gold);}
  .command-content{min-height:0;flex:1;overflow:auto;padding:12px;scrollbar-width:none;}.command-content::-webkit-scrollbar{display:none;}
  .command-footer{padding:10px 12px;border-top:1px solid #393329;background:#15191b;}
  .panel-prompt{font-size:12px;color:var(--muted);margin:0 0 10px;line-height:1.45;}
  .panel-cards{display:grid;gap:9px;}
  .panel-cards .card{min-height:104px;margin:0;}
  .panel-cards .card:hover{transform:translateX(-2px);}
  .panel-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .panel-actions button{min-height:44px;padding:8px;}
  .panel-wait{display:grid;place-items:center;height:100%;text-align:center;color:var(--muted);font-size:13px;line-height:1.6;}
  .result-pair{display:grid;gap:9px;}.result-line{padding:10px;border-left:3px solid var(--gold-dim);background:#202527;}.result-line.troia{border-color:var(--troia)}.result-line.gregos{border-color:var(--gregos)}
  .result-line span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.result-line strong{display:block;margin-top:3px;font-family:'Cormorant Garamond',serif;font-size:18px;}
  .force-list{display:grid;gap:10px}.force-side{padding:10px;border-left:3px solid var(--gold-dim);background:#202527}.force-side.gregos{border-color:var(--gregos)}.force-side.troia{border-color:var(--troia)}
  .force-side h3{margin:0 0 8px;font-size:17px}.force-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.force-stat{font-size:11px;color:var(--muted)}.force-stat strong{display:block;color:var(--cream);font-size:15px;margin-top:2px}
  .prep-history{margin-top:12px}.prep-history-title{font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}.prep-history-list{display:flex;flex-wrap:wrap;gap:5px}.prep-history-list span{padding:4px 6px;border:1px solid #4a4337;background:#171b1d;font-size:9px;color:#c9c1ad;}
  .command-panel .chronicle-box{margin:0;padding:0;background:transparent;color:var(--cream);max-height:none;overflow:visible}.command-panel .chronicle-box .entry{font-family:'IBM Plex Sans',sans-serif;font-size:12px;border-bottom:1px solid #37322a;padding:8px 0;margin:0}.command-panel .chron-btn{color:var(--cream)}

  .game-manual-dialog .quick-manual{margin:0;max-width:none;border:0;background:transparent}.game-manual-close{position:sticky;top:0;float:right;z-index:2;margin:4px -8px 0 8px;}
  .rotate-notice{display:none}.preview-toolbar{position:fixed;left:18px;bottom:18px;z-index:40;display:flex;gap:6px;padding:6px;background:#0c1011;border:1px solid var(--gold-dim)}.preview-toolbar button{padding:8px 10px;border:1px solid #514734;background:#202527;color:var(--cream);cursor:pointer;font-size:11px}.preview-toolbar button.active{border-color:var(--gold);color:var(--gold)}
  @media (max-width:640px){
    body{padding:22px 14px;}

    body.playing{padding:0 6px 6px}.panel-cards .card{min-height:84px;padding:9px}.command-header{padding:8px 10px}.command-title{font-size:18px}.command-content{padding:8px}
  }
  @media (max-width:900px) and (orientation:landscape){.table-shell{grid-template-columns:minmax(0,1fr) minmax(250px,34vw)}body.playing>h1{display:none}body.playing>.spear-rule{display:none}body.playing>#app{height:100dvh}.command-title{font-size:18px}.command-kicker{font-size:8px}}
  @media (max-width:900px) and (orientation:portrait){.rotate-notice{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;background:#101416;color:var(--cream)}.rotate-notice strong{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--gold);margin-bottom:8px}.rotate-notice span{max-width:320px;color:var(--muted);line-height:1.5}}

<body>
<h1>Guerra de Troia</h1>
<p class="subtitle">duelo online — cada jogador no seu próprio aparelho</p>
<div class="spear-rule"></div>
<div id="app"></div>
<script>
const API = '/.netlify/functions/room';
const KIND_ICON = {
  'Construção':'🏛️','Recurso':'🍎','Recrutamento':'⚔️','Sabedoria':'📜',
  'Equipamento':'🔥','Armadilha':'🕳️','Favor divino':'✨','Ritual':'🌊','Estratégia':'🧭'
};
const ACTION_LABEL = {avancar:'Avançar', recuar:'Recuar', atacar:'Atacar', reforcar:'Reforçar', buscar:'Buscar recursos', estratagema:'Estratagema'};
const LOCATION_LABEL = {muralhas:'Muralhas de Troia', planicie:'Planície', acampamento:'Acampamento Grego', portoes:'Portões de Troia'};
const LOCATION_ICON = {muralhas:'🏛️', planicie:'🌾', acampamento:'🏕️', portoes:'🚪'};
const LOCATION_ORDER = ['acampamento','planicie','muralhas','portoes'];
// Adicione aqui os PNGs da introdução. Com a lista vazia, o vídeo atual continua sendo usado.
const INTRO_SLIDES = [];

let session = null; // {code, role, token}
let view = null;
let localScreen = 'intro'; // intro | create | join | game
let errorMsg = null;
let pollTimer = null;
let logViewCycle = null;
let manualOpen = false;
let requestInFlight = false;
let pendingCardIndex = null;
let pendingAction = null;
let stateMisses = 0;
let stateGraceUntil = 0;
let panelTab = 'decision';
let previewMode = false;
let lastPanelPhase = null;

function loadSession(){
  try {
    const raw = localStorage.getItem('troia-session');
    if(raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}
function saveSession(s){
  try { localStorage.setItem('troia-session', JSON.stringify(s)); } catch(e) {}
}
function clearSession(){
  try { localStorage.removeItem('troia-session'); } catch(e) {}
}

async function api(action, opts){
  opts = opts || {};
  const method = opts.method || 'GET';
  const attempt = opts._attempt || 0;
  let url = API + '?action=' + encodeURIComponent(action);
  const fetchOpts = { method };
  if(method === 'GET'){
    const qs = new URLSearchParams(opts.params || {});
    url += '&' + qs.toString();
  } else {
    fetchOpts.headers = {'Content-Type':'application/json'};
    fetchOpts.body = JSON.stringify(opts.body || {});
  }
  const res = await fetch(url, fetchOpts);
  const data = await res.json().catch(()=>({error:'Resposta inválida do servidor.'}));
  if(!res.ok){
    const waitingForRoom = data.error === 'Sala não encontrada.' || data.error === 'Estado da partida ainda sincronizando.';
    if(method === 'POST' && waitingForRoom && attempt < 20){
      await new Promise(resolve=>setTimeout(resolve, 750));
      return api(action, Object.assign({}, opts, {_attempt:attempt+1}));
    }
    throw new Error(data.error || 'Erro na requisição.');
  }
  return data;
}

function actionBody(extra){
  return Object.assign({revision:(view && view.revision)||0}, session, extra||{});
}

async function refreshState(){
  if(!session) return;
  if(requestInFlight) return;
  try {
    const previousPhase = view && view.phase;
    const data = await api('state', { params:{ code:session.code, role:session.role, token:session.token } });
    if(view && (data.revision||0) < (view.revision||0)) return;
    view = data;
    stateMisses = 0;
    stateGraceUntil = 0;
    errorMsg = null;
    if(previousPhase === 'lobby' && view.phase === 'era-pick') playIntroVideo();
    if(!['siege-pick','siege-reveal','fim'].includes(view.phase)) logViewCycle = null;
    render();
  } catch(e){
    if(view && e.message === 'Sala não encontrada.' && (Date.now() < stateGraceUntil || stateMisses < 5)){
      stateMisses += 1;
      return;
    }
    errorMsg = e.message;
    render();
  }
}

function startPolling(){
  stopPolling();
  pollTimer = setInterval(refreshState, 1800);
  refreshState();
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}

async function criarSala(){
  errorMsg = null;
  try {
    const data = await api('create', { method:'POST', body:{} });
    session = { code:data.code, role:data.role, token:data.token };
    view = data;
    stateGraceUntil = Date.now()+30000;
    saveSession(session);
    localScreen = 'game';
    manualOpen = false;
    render();
    startPolling();
  } catch(e){ errorMsg = e.message; render(); }
}

async function entrarSala(code){
  errorMsg = null;
  try {
    const data = await api('join', { method:'POST', body:{ code } });
    session = { code:data.code, role:data.role, token:data.token };
    view = data;
    stateGraceUntil = Date.now()+30000;
    saveSession(session);
    localScreen = 'game';
    manualOpen = false;
    render();
    startPolling();
  } catch(e){ errorMsg = e.message; render(); }
}

async function sairSala(){
  stopPolling();
  session = null; view = null; errorMsg = null;
  clearSession();
  localScreen = 'intro';
  render();
}

async function iniciarDuelo(){
  try {
    view = await api('start', { method:'POST', body: actionBody() });
    manualOpen = false;
    playIntroVideo();
    render();
  }
  catch(e){ errorMsg = e.message; render(); }
}
async function escolherCartaEra(idx){
  if(previewMode){
    const picked = view.myHand[idx];
    view.resources.chosenCards[view.role].push({kind:picked.kind,name:picked.name});
    if(picked.kind==='Construção') view.resources.defenseCards.torres = true;
    if(picked.kind==='Recurso') view.resources.suprimentoTroia += 6;
    view.reveal = {troia:picked,gregos:{kind:'Equipamento',name:'Forjas de bronze',effect:'+1 ataque'}};
    view.phase = 'era-reveal'; lastPanelPhase = null; render(); return;
  }
  if(requestInFlight) return;
  requestInFlight = true;
  pendingCardIndex = idx;
  render();
  try {
    view = await api('pick-era', { method:'POST', body: actionBody({index:idx}) });
    errorMsg = null;
  }
  catch(e){ errorMsg = e.message; }
  finally { requestInFlight = false; pendingCardIndex = null; render(); }
}
async function continuarEra(){
  if(previewMode){
    view = previewView('prep'); view.eraStage='era2'; view.eraRound=1; view.eraRoundsTotal=2; lastPanelPhase=null; render(); return;
  }
  if(requestInFlight) return;
  requestInFlight = true;
  render();
  try {
    view = await api('advance-era', { method:'POST', body: actionBody() });
    errorMsg = null;
  }
  catch(e){ errorMsg = e.message; }
  finally { requestInFlight = false; render(); }
}
async function escolherAcao(choice){
  if(previewMode){
    view.phase='siege-reveal'; view.lastActions={troia:'reforcar',gregos:choice}; lastPanelPhase=null; render(); return;
  }
  if(requestInFlight) return;
  requestInFlight = true;
  pendingAction = choice;
  render();
  try {
    view = await api('pick-action', { method:'POST', body: actionBody({choice}) });
    errorMsg = null;
  }
  catch(e){ errorMsg = e.message; }
  finally { requestInFlight = false; pendingAction = null; render(); }
}
async function resolverCiclo(){
  if(previewMode){
    const chosen=view.lastActions.gregos;
    view.phase='siege-pick'; view.picked=false; view.actions=['avancar','recuar','atacar','reforcar','buscar','estratagema'];
    if(chosen==='avancar') view.siege.greekPosition='muralhas';
    view.siege.maneuver=3; view.siege.phaseOfYear='Outono'; lastPanelPhase=null; render(); return;
  }
  if(requestInFlight) return;
  requestInFlight = true;
  render();
  try {
    view = await api('resolve-cycle', { method:'POST', body: actionBody() });
    errorMsg = null;
  }
  catch(e){ errorMsg = e.message; }
  finally { requestInFlight = false; render(); }
}
async function novoDuelo(){
  try {
    view = await api('restart', { method:'POST', body: actionBody() });
    playIntroVideo();
    render();
  }
  catch(e){ errorMsg = e.message; render(); }
}

function playIntroVideo(){
  const old = document.getElementById('intro-video-overlay');
  if(old) old.remove();
  if(INTRO_SLIDES.length){
    playIntroSlides();
    return;
  }
  const overlay = document.createElement('div');
  overlay.className = 'intro-video-overlay';
  overlay.id = 'intro-video-overlay';
  overlay.innerHTML = `
    <div class="intro-video-panel">
      <video src="Midia/Introdução.mp4" autoplay playsinline controls></video>
      <div class="intro-video-actions">
        <button class="advance" onclick="window._closeIntroVideo()">Continuar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const video = overlay.querySelector('video');
  video.addEventListener('ended', ()=>window._closeIntroVideo());
  const started = video.play();
  if(started && started.catch) started.catch(()=>{ video.controls = true; });
}

let introSlideIndex = 0;
function playIntroSlides(){
  introSlideIndex = 0;
  const overlay = document.createElement('div');
  overlay.className = 'intro-video-overlay';
  overlay.id = 'intro-video-overlay';
  overlay.innerHTML = `<div class="intro-video-panel" id="intro-slide-panel"></div>`;
  document.body.appendChild(overlay);
  renderIntroSlide();
}

function renderIntroSlide(){
  const panel = document.getElementById('intro-slide-panel');
  if(!panel || !INTRO_SLIDES.length) return;
  const slide = INTRO_SLIDES[introSlideIndex];
  panel.innerHTML = `
    <div class="intro-slide">
      <img src="${slide.src}" alt="${slide.alt||'Introdução da campanha'}">
      ${slide.caption ? `<div class="intro-slide-caption">${slide.caption}</div>` : ''}
    </div>
    <div class="intro-progress">${INTRO_SLIDES.map((_,i)=>`<span class="${i===introSlideIndex?'active':''}"></span>`).join('')}</div>
    <div class="intro-video-actions">
      <button class="act" onclick="window._introPrev()" ${introSlideIndex===0?'disabled':''}>Anterior</button>
      <button class="advance" onclick="window._introNext()">${introSlideIndex===INTRO_SLIDES.length-1?'Começar':'Próximo'}</button>
      <button class="act" onclick="window._closeIntroVideo()">Pular</button>
    </div>`;
}

window._introPrev = function(){
  introSlideIndex = Math.max(0, introSlideIndex-1);
  renderIntroSlide();
};
window._introNext = function(){
  if(introSlideIndex >= INTRO_SLIDES.length-1) return window._closeIntroVideo();
  introSlideIndex += 1;
  renderIntroSlide();
};

window._closeIntroVideo = function(){
  const overlay = document.getElementById('intro-video-overlay');
  if(overlay) overlay.remove();
};

function statsHTML(){
  const s = view.siege;
  if(!s) return '';
  return `
  <div class="fronts">
    <div class="front troia ${view.role==='troia' && view.phase==='siege-pick' && !view.picked ? 'active':''}">
      <h3>🏛️ Troia</h3>
      <div class="stat-row">
        <div class="stat-label"><span>Tropas</span><span>${s.tropasTroia}/${s.tropasTroiaMax||'-'}</span></div>
        <div class="bar-track"><div class="bar-fill troia" style="width:${s.tropasTroiaMax? s.tropasTroia/s.tropasTroiaMax*100:0}%"></div></div>
      </div>
      <div class="small-stats">
        <span><b>🍎 Suprimento</b>${s.suprimentoTroia}</span>
        <span><b>❄️ Consumo</b>${s.consumoTroia}/ano</span>
        <span><b>⏳ Estoque</b>${s.anosSuprimentoTroia} ano(s)</span>
        <span><b>🛡️ Defesa</b>+${s.bonusDefesaTroia||0}</span>
      </div>
    </div>
    <div class="divider"></div>
    <div class="front gregos ${view.role==='gregos' && view.phase==='siege-pick' && !view.picked ? 'active':''}">
      <h3>⛺ Gregos</h3>
      <div class="stat-row">
        <div class="stat-label"><span>Determinação</span><span>${s.determinacao}/${s.determinacaoMax||16}</span></div>
        <div class="bar-track"><div class="bar-fill gregos" style="width:${s.determinacaoMax? s.determinacao/s.determinacaoMax*100:0}%"></div></div>
      </div>
      <div class="small-stats">
        <span><b>⚔️ Tropas</b>${s.tropasGregos}</span>
        <span><b>🍎 Suprimento</b>${s.suprimentoGregos}</span>
        <span><b>❄️ Consumo</b>${s.consumoGregos}/ano</span>
        <span><b>⏳ Estoque</b>${s.anosSuprimentoGregos} ano(s)</span>
        <span><b>🔥 Ataque</b>+${s.bonusAtaqueGregos}</span>
      </div>
    </div>
  </div>`;
}

function eraResourcesHTML(){
  const r = view.resources;
  if(!r) return '';
  return `
  <div class="resources-title">Recursos atuais</div>
  <div class="fronts">
    <div class="front troia">
      <h3>🏛️ Troia</h3>
      <div class="small-stats">
        <span><b>🛡️ Defesa</b>+${r.bonusDefesaTroia||0}</span>
        <span><b>⚔️ Tropas</b>${r.tropasTroia}</span>
        <span><b>🍎 Suprimento</b>${r.suprimentoTroia}</span>
      </div>
    </div>
    <div class="divider"></div>
    <div class="front gregos">
      <h3>⛺ Gregos</h3>
      <div class="small-stats">
        <span><b>⚔️ Tropas</b>${r.tropasGregos}</span>
        <span><b>🍎 Suprimento</b>${r.suprimentoGregos}</span>
        <span><b>🔥 Ataque</b>+${r.bonusAtaqueGregos}</span>
      </div>
    </div>
  </div>`;
}

function battleMapHTML(active, title){
  return `
  <div class="battle-map">
    ${title ? `<div class="battle-map-title">${title}</div>` : ''}
    <div class="battle-map-row board-view">
      ${LOCATION_ORDER.map(loc => `
        <div class="battle-node ${active===loc?'active':''}" style="grid-area:${loc}">
          <div class="battle-node-icon">${LOCATION_ICON[loc]}</div>
          <div class="battle-node-label">${LOCATION_LABEL[loc]}</div>
        </div>`).join('')}
    </div>
  </div>`;
}

function stageTitle(stage){
  return stage === 'era1' ? 'Mobilização' : 'Preparativos para o cerco';
}

function trackPips(value, max){
  const total = 9;
  const filled = Math.max(0, Math.min(total, Math.round((value/(max||total))*total)));
  return Array.from({length:total},(_,i)=>`<i class="track-pip ${i<filled?'on':''}"></i>`).join('');
}

function campaignBoardHTML(options){
  const prep = options && options.prep;
  const r = prep ? view.resources : view.siege;
  if(!r) return '';
  const defenses = prep
    ? {
        fosso:{active:!!(r.defenseCards && r.defenseCards.fosso)},
        torres:{active:!!(r.defenseCards && r.defenseCards.torres)},
        muralha:{active:true},
        pedras:{active:!!(r.defenseCards && r.defenseCards.pedras)}
      }
    : (r.defenses || {});
  const greekTroops = r.tropasGregos;
  const greekSupply = r.suprimentoGregos;
  const greekAttack = r.bonusAtaqueGregos || 0;
  const greekConsumption = r.consumoGregos || Math.max(1,Math.ceil(greekTroops/4));
  const greekMorale = prep ? (r.determinacao||5) : r.determinacao;
  const greekMoraleMax = prep ? 9 : (r.determinacaoMax||9);
  const troyTroops = r.tropasTroia;
  const troySupply = r.suprimentoTroia;
  const troyDefense = r.bonusDefesaTroia || 0;
  const troyConsumption = r.consumoTroia || Math.max(1,Math.ceil(troyTroops/4));
  const season = prep ? '' : String(r.phaseOfYear||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return `
    <div class="campaign-board" aria-label="Tabuleiro da campanha">
      <img src="Midia/Tabuleiro Digital.png" alt="Tabuleiro da Guerra de Troia visto de cima">
      <span class="board-zone-focus gregos"></span><span class="board-zone-focus troia"></span><span class="board-zone-focus defesas"></span>
      <div class="board-track greek-troops">${trackPips(greekTroops,prep?16:(r.tropasGregosMax||16))}</div>
      <div class="board-track troy-troops">${trackPips(troyTroops,prep?16:(r.tropasTroiaMax||16))}</div>
      <div class="board-track greek-morale">${trackPips(greekMorale,greekMoraleMax)}</div>
      <div class="board-track troy-supply">${trackPips(troySupply,18)}</div>
      <span class="track-count greek-troops" title="Tropas gregas">${greekTroops}</span>
      <span class="track-count troy-troops" title="Tropas troianas">${troyTroops}</span>
      <span class="track-count greek-morale" title="Determinação grega">${greekMorale}</span>
      <span class="track-count troy-supply" title="Suprimento de Troia">${troySupply}</span>
      <span class="board-metric greek-attack" title="Ataque grego">+${greekAttack}</span>
      <span class="board-metric greek-supply" title="Suprimento grego">${greekSupply}</span>
      <span class="board-metric greek-consumption" title="Consumo grego">${greekConsumption}</span>
      <span class="board-metric troy-attack" title="Tropas de Troia">${troyTroops}</span>
      <span class="board-metric troy-supply" title="Suprimento troiano">${troySupply}</span>
      <span class="board-metric troy-consumption" title="Consumo troiano">${troyConsumption}</span>
      <span class="board-metric troy-defense" title="Defesa troiana">+${troyDefense}</span>
      <div class="board-defense-markers">
        ${[['fosso','Fosso'],['torres','Torres'],['muralha','Muralha'],['pedras','Pedras']].map(([key,label])=>{
          const item = defenses[key] || {};
          const active = item.active && !item.broken;
          const max = item.max || 0;
          const pressure = item.pressure || 0;
          const dots = max ? `<span class="defense-pressure">${Array.from({length:max},(_,i)=>`<i class="${i<pressure?'on':''}"></i>`).join('')}</span>` : '';
          return `<span class="board-defense-marker ${active?'active':''} ${item.broken?'broken':''}" title="${label}">${dots}</span>`;
        }).join('')}
      </div>
      ${prep ? '' : `<div class="army-marker ${r.greekPosition}" title="${LOCATION_LABEL[r.greekPosition]}">⚔</div><div class="season-marker ${season}" title="${r.phaseOfYear}"></div>`}
    </div>`;
}

async function criarSolo(role){
  errorMsg = null;
  try {
    const data = await api('create-solo', { method:'POST', body:{ role } });
    session = { code:data.code, role:data.role, token:data.token };
    view = data;
    stateGraceUntil = Date.now()+30000;
    saveSession(session);
    localScreen = 'game';
    manualOpen = false;
    playIntroVideo();
    render();
    startPolling();
  } catch(e){ errorMsg = e.message; render(); }
}

function defenseHTML(){
  const d = view.siege.defenses;
  if(!d) return '';
  const items = [
    ['fosso','Fosso','2 pressões removem a defesa'],
    ['torres','Torres','2 pressões neutralizam a vigilância'],
    ['muralha','Muralha','3 pressões rompem o caminho aos portões'],
    ['pedras','Pedras','Bônus defensivo; não recebe pressão']
  ];
  return `
    <div class="defense-row">
      ${items.map(([key,name,note])=>{
        const def = d[key] || {};
        const inactive = !def.active;
        const broken = !!def.broken;
        const max = def.max || 0;
        const pressure = def.pressure || 0;
        const dots = max
          ? `<div class="pressure-dots">${Array.from({length:max}).map((_,i)=>`<span class="pressure-dot ${i<pressure?'filled':''}"></span>`).join('')}</div>`
          : '<div class="pressure-dots"></div>';
        return `
          <div class="defense-tile ${inactive?'inactive':''} ${broken?'broken':''}">
            <div class="defense-name">${name}</div>
            ${dots}
            <div class="defense-note">${inactive ? 'não construída' : broken ? 'neutralizada' : note}</div>
          </div>`;
      }).join('')}
    </div>`;
}

function siegeBoardHTML(title){
  const s = view.siege;
  if(!s) return '';
  return `
    <div class="siege-board">
      ${campaignBoardHTML({prep:false})}
      ${defenseHTML()}
    </div>`;
}

function currentLogCycle(){
  const max = view.siege.cycle;
  if(logViewCycle === null || logViewCycle > max) return max;
  if(logViewCycle < 1) return 1;
  return logViewCycle;
}

function chronicleHTML(){
  const s = view.siege;
  if(!s || !s.cycleLogs) return '';
  const cyc = currentLogCycle();
  const entries = (s.cycleLogs[cyc] || []).slice().reverse();
  const canPrev = cyc > 1;
  const canNext = cyc < s.cycle;
  return `
  <div class="chronicle-box">
    <div class="chronicle-nav">
      <button class="chron-btn" onclick="navLog(-1)" ${canPrev?'':'disabled'}>‹</button>
      <span class="chron-cycle">Ano ${cyc}</span>
      <button class="chron-btn" onclick="navLog(1)" ${canNext?'':'disabled'}>›</button>
    </div>
    ${entries.length ? entries.map(e=>`<div class="entry">${e.html}</div>`).join('') : '<div class="entry" style="opacity:.6">Nenhum evento registrado.</div>'}
  </div>`;
}

window.navLog = function(delta){
  const max = view.siege.cycle;
  const cur = currentLogCycle();
  logViewCycle = Math.max(1, Math.min(max, cur+delta));
  render();
};

window._rememberManual = function(open){
  manualOpen = open;
};

window.setPanelTab = function(tab){
  panelTab = tab;
  render();
};

window.toggleGameManual = function(open){
  manualOpen = typeof open === 'boolean' ? open : !manualOpen;
  render();
};

window.focusBoard = function(target){
  const board = document.querySelector('.campaign-board');
  if(board) board.dataset.focus = target || '';
};

function errorHTML(){
  return errorMsg ? `<div class="error-banner">${errorMsg}</div>` : '';
}

function manualHTML(compact){
  const opened = compact ? manualOpen : true;
  return `
  <details class="quick-manual" ${opened ? 'open' : ''} ontoggle="window._rememberManual(this.open)">
    <summary>Manual rápido</summary>
    <div class="manual-body">
      <h3>Objetivo</h3>
      <div class="manual-grid">
        <div class="manual-side troia">
          <b>🏛️ Troia</b>
          <span>Resista ao cerco. Você vence se os Gregos ficarem sem tropas ou se a determinação deles cair a zero.</span>
        </div>
        <div class="manual-side gregos">
          <b>⛺ Gregos</b>
          <span>Derrube a defesa troiana. Você vence se Troia ficar sem tropas.</span>
        </div>
      </div>

      <h3>Como a partida anda</h3>
      <ul class="manual-list">
        <li><b>Criar sala:</b> quem cria joga como Troia; quem entra com o código joga como os Gregos.</li>
        <li><b>Mobilização:</b> os Gregos formam o acampamento enquanto Troia abastece e prepara a cidadela.</li>
        <li><b>Preparativos para o cerco:</b> os navios chegam à costa sem combate naval. Ambos concluem tropas, recursos, favores e defesas.</li>
        <li><b>Cerco:</b> cada ano tem 3 manobras: Primavera, Verão e Outono. Depois vem o inverno, com consumo de suprimentos.</li>
      </ul>

      <h3>Ações do cerco</h3>
      <ul class="manual-list">
        <li><b>Avançar/Recuar:</b> ações gregas para mover o exército pela trilha Acampamento, Planície, Muralhas e Portões.</li>
        <li><b>Atacar:</b> força combate ou pressão contra as defesas, conforme a posição grega.</li>
        <li><b>Reforçar:</b> gasta 1 suprimento. Troia pode remover pressão de uma defesa; Gregos consolidam a ofensiva.</li>
        <li><b>Estratagema:</b> tenta antecipar avanço, ataque ou saída inimiga.</li>
        <li><b>Buscar recursos:</b> Gregos recebem suprimento para vários anos, mas Troia pode saquear se atacar o acampamento no momento certo.</li>
      </ul>

      <h3>Dicas de leitura</h3>
      <ul class="manual-list">
        <li><b>Tropas</b> são sua vida militar. Se zerarem, seu lado desmorona.</li>
        <li><b>Suprimento</b> alimenta tropas e paga reforços. Falta de suprimento causa perdas.</li>
        <li><b>Pressão</b> remove fosso, torres e muralha. Pedras do alto são bônus defensivo, não uma estrutura a derrubar.</li>
        <li><b>Bônus de defesa</b> vem das estruturas ainda ativas e de cartas como Favor de Apolo e Engenharia de Hefesto.</li>
        <li><b>Determinação</b> mede a moral grega: cai a cada dois anos, por fome, por recuos duros ou por um ano sem ataque.</li>
      </ul>
    </div>
  </details>`;
}

function gameManualOverlayHTML(){
  if(!manualOpen) return '';
  return `<div class="game-manual-overlay" onclick="if(event.target===this)toggleGameManual(false)">
    <div class="game-manual-dialog">
      <button class="icon-button game-manual-close" title="Fechar manual" onclick="toggleGameManual(false)">×</button>
      ${manualHTML(false)}
    </div>
  </div>`;
}

function forcePanelHTML(prep){
  const s = prep ? view.resources : view.siege;
  if(!s) return '';
  const gConsumption = s.consumoGregos || Math.max(1,Math.ceil(s.tropasGregos/4));
  const tConsumption = s.consumoTroia || Math.max(1,Math.ceil(s.tropasTroia/4));
  return `<div class="force-list">
    <section class="force-side gregos"><h3>Gregos</h3><div class="force-grid">
      <div class="force-stat">Tropas<strong>${s.tropasGregos}</strong></div><div class="force-stat">Suprimento<strong>${s.suprimentoGregos}</strong></div>
      <div class="force-stat">Ataque<strong>+${s.bonusAtaqueGregos||0}</strong></div><div class="force-stat">Consumo<strong>${gConsumption}</strong></div>
      ${prep?'':`<div class="force-stat">Determinação<strong>${s.determinacao}/${s.determinacaoMax}</strong></div><div class="force-stat">Estoque<strong>${s.anosSuprimentoGregos} ano(s)</strong></div>`}
    </div></section>
    <section class="force-side troia"><h3>Troia</h3><div class="force-grid">
      <div class="force-stat">Tropas<strong>${s.tropasTroia}</strong></div><div class="force-stat">Suprimento<strong>${s.suprimentoTroia}</strong></div>
      <div class="force-stat">Defesa<strong>+${s.bonusDefesaTroia||0}</strong></div><div class="force-stat">Consumo<strong>${tConsumption}</strong></div>
      ${prep?'':`<div class="force-stat">Posição inimiga<strong>${LOCATION_LABEL[s.greekPosition]}</strong></div><div class="force-stat">Estoque<strong>${s.anosSuprimentoTroia} ano(s)</strong></div>`}
    </div></section>
  </div>`;
}

function preparationHistoryHTML(){
  const chosen = view.resources && view.resources.chosenCards;
  if(!chosen) return '';
  const list = [...(chosen.gregos||[]),...(chosen.troia||[])];
  if(view.pendingPreparation) list.push(view.pendingPreparation);
  if(!list.length) return '';
  return `<div class="prep-history"><div class="prep-history-title">No tabuleiro</div><div class="prep-history-list">${list.map(c=>`<span>${c.name}</span>`).join('')}</div></div>`;
}

function panelTabsHTML(){
  return `<div class="command-tabs">
    <button class="${panelTab==='decision'?'active':''}" onclick="setPanelTab('decision')">Decisão</button>
    <button class="${panelTab==='forces'?'active':''}" onclick="setPanelTab('forces')">Forças</button>
    <button class="${panelTab==='chronicle'?'active':''}" onclick="setPanelTab('chronicle')">Crônica</button>
  </div>`;
}

function tableShellHTML({board,title,kicker,decision,footer,prep}){
  let panelContent = decision;
  if(panelTab === 'forces') panelContent = forcePanelHTML(!!prep);
  if(panelTab === 'chronicle') panelContent = prep ? '<div class="panel-wait">A crônica começa com o primeiro ano do cerco.</div>' : chronicleHTML();
  return `${errorHTML()}<div class="table-shell">
    <main class="table-stage">${board}</main>
    <aside class="command-panel">
      <header class="command-header"><div class="command-topline"><div><div class="command-kicker">${kicker}</div><h2 class="command-title">${title}</h2></div><button class="icon-button" title="Abrir manual" onclick="toggleGameManual(true)">?</button></div></header>
      ${panelTabsHTML()}
      <div class="command-content">${panelContent}</div>
      ${footer?`<footer class="command-footer">${footer}</footer>`:''}
    </aside>
  </div>${gameManualOverlayHTML()}<div class="rotate-notice"><strong>Vire o aparelho</strong><span>A mesa de jogo foi criada para ser usada na horizontal.</span></div>${previewToolbarHTML()}`;
}

function cardFocusTarget(card){
  return card && card.kind === 'Construção' ? 'defesas' : view.role;
}

function previewToolbarHTML(){
  if(!previewMode) return '';
  return `<div class="preview-toolbar"><button class="${view&&view.siege?'':'active'}" onclick="setPreview('prep')">Mobilização</button><button class="${view&&view.siege?'active':''}" onclick="setPreview('siege')">Cerco</button></div>`;
}

function previewView(mode){
  if(mode === 'siege'){
    return {code:'LOCAL',revision:4,phase:'siege-pick',role:'gregos',solo:true,aiRole:'troia',picked:false,actions:['avancar','recuar','atacar','reforcar','buscar','estratagema'],siege:{
      bonusDefesaTroia:5,defenses:{fosso:{active:true,pressure:1,max:2,broken:false},torres:{active:true,pressure:0,max:2,broken:false},muralha:{active:true,pressure:2,max:3,broken:false},pedras:{active:true,pressure:0,max:0,broken:false}},
      tropasTroia:11,tropasTroiaMax:14,suprimentoTroia:10,consumoTroia:3,anosSuprimentoTroia:3,tropasGregos:13,tropasGregosMax:16,suprimentoGregos:8,consumoGregos:4,anosSuprimentoGregos:2,bonusAtaqueGregos:2,determinacao:6,determinacaoMax:9,cycle:3,maneuver:2,maneuversPerYear:3,phaseOfYear:'Verão',greekPosition:'planicie',cycleLogs:{3:[{html:'<b>Primavera</b> — <span class="tag gregos">Gregos</span> avançam para a planície.'},{html:'<b>Primavera</b> — <span class="tag troia">Troia</span> reforça a muralha.'}]}
    }};
  }
  return {code:'LOCAL',revision:0,phase:'era-pick',role:'troia',solo:true,aiRole:'gregos',eraStage:'era1',eraRound:2,eraRoundsTotal:3,picked:false,pendingPreparation:null,myHand:[
    {kind:'Construção',name:'Torres de vigia',effect:'Ativa torres e melhora a defesa das muralhas.'},{kind:'Recurso',name:'Celeiros reais',effect:'+6 suprimentos armazenados na cidadela.'}
  ],resources:{bonusDefesaTroia:2,defenseCards:{fosso:true,torres:false,pedras:false,muralha:false},portoesSelados:false,racionamentoAtivo:false,tropasTroia:10,suprimentoTroia:8,bonusAtaqueGregos:1,tropasGregos:11,suprimentoGregos:7,determinacao:5,chosenCards:{troia:[{kind:'Construção',name:'Fosso de contenção'}],gregos:[{kind:'Recrutamento',name:'Recrutas de Micenas'}]}}};
}

window.setPreview = function(mode){
  previewMode = true;
  localScreen = 'game';
  view = previewView(mode);
  lastPanelPhase = null;
  panelTab = 'decision';
  render();
};

function render(){
  const app = document.getElementById('app');
  const playing = localScreen === 'game' && view && view.phase !== 'lobby';
  document.body.classList.toggle('playing', !!playing);

  if(localScreen === 'intro'){
    app.innerHTML = `
      ${errorHTML()}
      <div class="setup">
        <p>Cada jogador entra pelo próprio celular ou computador — não precisa mais revezar o mesmo aparelho.
        Um dos lados cria a sala e manda o código pro outro entrar.</p>
        <button class="advance wide" style="max-width:280px;margin:0 auto;" onclick="window._go('create')">Criar sala</button>
        <div class="divider-or">ou</div>
        <button class="wide" style="max-width:280px;margin:0 auto;" onclick="window._go('join')">Entrar com um código</button>
        <div class="divider-or">modo solo</div>
        <div class="action-grid" style="max-width:420px;margin:0 auto;">
          <button class="act" onclick="criarSolo('troia')">Solo como Troia</button>
          <button class="act" onclick="criarSolo('gregos')">Solo como Gregos</button>
        </div>
        ${manualHTML(false)}
      </div>`;
    return;
  }

  if(localScreen === 'create'){
    app.innerHTML = `
      ${errorHTML()}
      <div class="setup">
        <p>Você vai jogar como <b>Troia</b>. Clique abaixo pra gerar o código da sala e compartilhar com quem vai jogar dos Gregos.</p>
        <button class="advance wide" style="max-width:280px;margin:0 auto;" onclick="criarSala()">Gerar código da sala</button>
        <p class="share-hint"><a href="#" onclick="window._go('intro');return false;" style="color:var(--muted);">voltar</a></p>
      </div>`;
    return;
  }

  if(localScreen === 'join'){
    app.innerHTML = `
      ${errorHTML()}
      <div class="setup">
        <p>Você vai jogar como os <b>Gregos</b>. Digite o código de 5 letras que o outro jogador te passou.</p>
        <input class="code-input" id="join-code" maxlength="5" placeholder="XXXXX" autofocus>
        <div style="margin-top:16px;">
          <button class="advance" onclick="window._joinFromInput()">Entrar na sala</button>
        </div>
        <p class="share-hint"><a href="#" onclick="window._go('intro');return false;" style="color:var(--muted);">voltar</a></p>
      </div>`;
    return;
  }

  if(localScreen === 'game'){
    if(!view){
      app.innerHTML = `${errorHTML()}<div class="setup"><p>${errorMsg?'Não foi possível recuperar esta partida.':'Carregando sala...'}</p>${errorMsg?'<button class="act" onclick="sairSala()">Voltar ao início</button>':''}</div>`;
      return;
    }
    renderGame(app);
    return;
  }
}

function renderGame(app){
  const v = view;

  if(v.phase === 'lobby'){
    app.innerHTML = `
      ${errorHTML()}
      <div class="pass-screen">
        <div class="pass-icon">${v.role==='troia'?'🏛️':'⛺'}</div>
        <h2>Sala ${v.code}</h2>
        <div class="role-pill ${v.role}">Você é ${v.role==='troia'?'Troia':'os Gregos'}</div>
        ${v.solo
          ? `<p>Modo solo ativo. A IA joga como ${v.aiRole==='troia'?'Troia':'os Gregos'}.</p>`
          : v.roomFull
          ? `<p>Os dois lados estão prontos.</p><button class="advance" onclick="iniciarDuelo()">Começar duelo</button>`
          : `<div class="room-code">${v.code}</div><p>Compartilhe esse código com o outro jogador. Aguardando ele entrar...</p>`}
        ${manualHTML(true)}
        <p class="share-hint"><a href="#" onclick="sairSala();return false;" style="color:var(--muted);">sair da sala</a></p>
      </div>`;
    return;
  }

  if(lastPanelPhase !== v.phase){
    panelTab = 'decision';
    lastPanelPhase = v.phase;
  }

  if(v.phase === 'era-pick'){
    const decision = v.picked
      ? `<div class="panel-wait"><div>Preparação confirmada.<br>Aguardando o outro lado.${preparationHistoryHTML()}</div></div>`
      : `<p class="panel-prompt">Escolha uma preparação. O local afetado será destacado na mesa.</p><div class="panel-cards">${v.myHand.map((c,i)=>`
          <div class="card ${pendingCardIndex===i?'selected':''} ${requestInFlight?'busy':''}" onmouseenter="focusBoard('${cardFocusTarget(c)}')" onmouseleave="focusBoard('')" onclick="escolherCartaEra(${i})">
            <div class="kind">${KIND_ICON[c.kind]||''} ${c.kind}</div><div class="name">${c.name}</div><div class="effect">${pendingCardIndex===i?'Confirmando preparação...':c.effect}</div>
          </div>`).join('')}</div>${preparationHistoryHTML()}`;
    app.innerHTML = tableShellHTML({
      board:campaignBoardHTML({prep:true}), prep:true,
      kicker:`${v.role==='troia'?'Troia':'Gregos'} · escolha ${v.eraRound} de ${v.eraRoundsTotal}`,
      title:stageTitle(v.eraStage), decision,
      footer:`<span class="role-pill ${v.role}">Você comanda ${v.role==='troia'?'Troia':'os Gregos'}</span>`
    });
    return;
  }

  if(v.phase === 'era-reveal'){
    const rv = v.reveal;
    const decision = `<p class="panel-prompt">As duas preparações foram incorporadas à mesa.</p><div class="result-pair"><div class="result-line troia"><span>Troia</span><strong>${rv.troia.name}</strong></div><div class="result-line gregos"><span>Gregos</span><strong>${rv.gregos.name}</strong></div></div>${preparationHistoryHTML()}`;
    app.innerHTML = tableShellHTML({board:campaignBoardHTML({prep:true}),prep:true,kicker:`Resultado · escolha ${v.eraRound} de ${v.eraRoundsTotal}`,title:stageTitle(v.eraStage),decision,footer:`<button class="advance wide" onclick="continuarEra()" ${requestInFlight?'disabled':''}>Continuar</button>`});
    return;
  }

  if(v.phase === 'siege-pick'){
    const actions = v.actions;
    const decision = v.picked
      ? '<div class="panel-wait">Manobra confirmada.<br>Aguardando o outro lado.</div>'
      : `<p class="panel-prompt">Escolha uma manobra para esta estação.</p><div class="panel-actions">${actions.map(a=>`<button class="act" onclick="escolherAcao('${a}')" ${requestInFlight?'disabled':''}>${pendingAction===a?'Confirmando...':ACTION_LABEL[a]}</button>`).join('')}</div><p class="panel-prompt" style="margin-top:12px">Posição atual: <b>${LOCATION_LABEL[v.siege.greekPosition]}</b></p>`;
    app.innerHTML = tableShellHTML({board:campaignBoardHTML({prep:false}),prep:false,kicker:`Ano ${v.siege.cycle} · ${v.siege.phaseOfYear} · ${v.siege.maneuver}/${v.siege.maneuversPerYear}`,title:'Planejamento',decision,footer:`<span class="role-pill ${v.role}">Você comanda ${v.role==='troia'?'Troia':'os Gregos'}</span>`});
    return;
  }

  if(v.phase === 'siege-reveal'){
    const la = v.lastActions;
    const resolveLabel = v.siege.maneuver >= v.siege.maneuversPerYear ? 'Resolver manobra e inverno' : 'Resolver manobra';
    const decision = `<p class="panel-prompt">As ordens foram reveladas. Resolva a manobra para atualizar a mesa.</p><div class="result-pair"><div class="result-line troia"><span>Troia</span><strong>${ACTION_LABEL[la.troia]}</strong></div><div class="result-line gregos"><span>Gregos</span><strong>${ACTION_LABEL[la.gregos]}</strong></div></div>`;
    app.innerHTML = tableShellHTML({board:campaignBoardHTML({prep:false}),prep:false,kicker:`Ano ${v.siege.cycle} · ${v.siege.phaseOfYear}`,title:'Ordens reveladas',decision,footer:`<button class="advance wide" onclick="resolverCiclo()" ${requestInFlight?'disabled':''}>${resolveLabel}</button>`});
    return;
  }

  if(v.phase === 'fim'){
    const venceu = v.siege.gameOver;
    const textos = {
      tropas: venceu==='troia' ? 'O exército grego se dissolveu por completo — sem homens, o cerco não pode continuar.' : 'A guarnição de Troia foi reduzida a nada — a cidade não tem mais quem a defenda.',
      moral: 'Sem vitórias suficientes para justificar mais um ano longe de casa, o acampamento grego se desfaz.',
      portoes: 'As defesas foram superadas e os portões não resistiram ao assalto final.'
    };
    const decision = `<div class="endgame"><h2>${venceu==='troia' ? 'Troia resiste' : 'O cerco vence'}</h2><p>${textos[v.siege.reason]||''}</p></div>`;
    app.innerHTML = tableShellHTML({board:campaignBoardHTML({prep:false}),prep:false,kicker:`Ano ${v.siege.cycle} · fim do cerco`,title:'A campanha terminou',decision,footer:'<button class="restart wide" onclick="novoDuelo()">Novo duelo</button>'});
    return;
  }
}

window._go = function(screen){ errorMsg = null; localScreen = screen; render(); };
window._joinFromInput = function(){
  const input = document.getElementById('join-code');
  const code = (input.value || '').trim();
  if(!code){ errorMsg = 'Digite o código da sala.'; render(); return; }
  entrarSala(code);
};

(function init(){
  const params = new URLSearchParams(location.search);
  const localPreview = ['127.0.0.1','localhost'].includes(location.hostname) && params.has('preview');
  if(localPreview){
    previewMode = true;
    localScreen = 'game';
    view = previewView(params.get('preview')==='siege'?'siege':'prep');
    render();
    return;
  }
  const saved = loadSession();
  if(saved){
    session = saved;
    localScreen = 'game';
    startPolling();
  } else {
    render();
  }
})();
</script>
</body>
</html>
