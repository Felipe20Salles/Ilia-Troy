<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guerra de Troia — Duelo online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14181A; --panel:#1D2224; --parchment:#E7DCC2; --ink:#26211A;
    --gold:#B8935A; --gold-dim:#7A6440;
    --troia:#4C7A6C; --troia-dim:#2E4A41; --troia-light:#A9CBBE;
    --gregos:#9A4235; --gregos-dim:#63241C; --gregos-light:#E3B2A6;
    --cream:#E8E3D3; --muted:#8B8B7E; --error:#C85C4B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:'IBM Plex Sans',sans-serif;padding:28px 20px;max-width:1180px;margin:0 auto;}
  h1,h3{font-family:'Cormorant Garamond',serif;}
  h1{font-size:32px;font-weight:600;margin:0 0 4px;color:var(--gold);text-align:center;}
  .subtitle{text-align:center;color:var(--muted);margin:0 0 24px;font-style:italic;font-family:'Cormorant Garamond',serif;font-size:16px;}
  .spear-rule{height:1px;background:linear-gradient(to right,transparent,var(--gold-dim),transparent);margin:16px 0;}
  .setup{text-align:center;padding:16px 0;}
  .setup p{color:var(--muted);line-height:1.6;max-width:520px;margin:0 auto 20px;}
  input.code-input{
    font-family:'IBM Plex Sans',sans-serif;font-size:20px;letter-spacing:4px;text-align:center;text-transform:uppercase;
    padding:12px;border-radius:3px;border:1px solid var(--gold-dim);background:var(--panel);color:var(--cream);width:180px;max-width:100%;
  }
  button.act, button.advance, button.restart, button.wide{
    padding:13px 18px;border-radius:3px;border:1px solid var(--gold-dim);background:var(--panel);color:var(--cream);
    font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s ease;
  }
  button:disabled{opacity:0.5;cursor:default;}
  button.act:hover, button.wide:hover{background:#262C2E;border-color:var(--gold);}
  button.advance{border-color:var(--gold);background:var(--gold-dim);color:#14181A;font-weight:600;}
  button.advance:hover{background:var(--gold);}
  button.wide{width:100%;}
  .pass-screen{text-align:center;padding:60px 20px;}
  .pass-icon{font-size:56px;margin-bottom:18px;}
  .pass-screen h2{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold);margin:0 0 10px;}
  .pass-screen p{color:var(--muted);margin:0 0 26px;}
  .room-code{font-size:34px;letter-spacing:8px;font-weight:600;color:var(--gold);margin:14px 0;font-family:'Cormorant Garamond',serif;}
  .cycle-header{text-align:center;margin-bottom:16px;}
  .cycle-header .label{font-size:13px;color:var(--muted);letter-spacing:0.5px;}
  .cycle-header .phase{font-size:22px;color:var(--gold);font-family:'Cormorant Garamond',serif;font-weight:600;}
  .fronts{display:grid;grid-template-columns:1fr 1px 1fr;gap:18px;margin-bottom:18px;}
  .divider{background:linear-gradient(180deg,transparent,var(--gold-dim),transparent);}
  .front{padding:14px 16px;border-radius:3px;background:var(--panel);}
  .front.troia{border-left:3px solid var(--troia);}
  .front.gregos{border-left:3px solid var(--gregos);}
  .front h3{margin:0 0 10px;font-size:18px;font-weight:600;}
  .front.troia h3{color:var(--troia-light);}
  .front.gregos h3{color:var(--gregos-light);}
  .front.active{outline:1px solid var(--gold);}
  .stat-row{margin-bottom:9px;}
  .stat-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px;}
  .bar-track{height:7px;background:#0F1213;border-radius:2px;overflow:hidden;}
  .bar-fill{height:100%;transition:width .4s ease;}
  .bar-fill.troia{background:var(--troia);}
  .bar-fill.gregos{background:var(--gregos);}
  .small-stats{display:flex;gap:12px;margin-top:10px;font-size:13px;color:var(--cream);flex-wrap:wrap;}
  .small-stats span b{color:var(--muted);font-weight:400;font-size:11px;display:flex;align-items:center;gap:4px;}
  .chronicle-box{background:var(--parchment);color:var(--ink);border-radius:3px;padding:14px 16px;margin-bottom:18px;max-height:210px;overflow-y:auto;}
  .chronicle-box .entry{font-size:15px;line-height:1.5;margin-bottom:9px;font-family:'Cormorant Garamond',serif;}
  .chronicle-box .entry:last-child{margin-bottom:0;}
  .chronicle-box .entry .tag{font-weight:600;}
  .chronicle-box .entry .tag.troia{color:var(--troia-dim);}
  .chronicle-box .entry .tag.gregos{color:var(--gregos-dim);}
  .actions{text-align:center;}
  .action-prompt{font-size:14px;color:var(--muted);margin-bottom:12px;}
  .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .action-grid.three{grid-template-columns:1fr 1fr 1fr;}
  .reveal-box{display:flex;justify-content:space-around;margin-bottom:18px;}
  .reveal-item{text-align:center;}
  .reveal-item .who{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .reveal-item .act-name{font-size:19px;font-family:'Cormorant Garamond',serif;font-weight:600;}
  .reveal-item.troia .act-name{color:var(--troia-light);}
  .reveal-item.gregos .act-name{color:var(--gregos-light);}
  .endgame{text-align:center;padding:16px 0;}
  .endgame h2{font-size:28px;margin:0 0 10px;color:var(--gold);}
  .endgame p{color:var(--muted);max-width:480px;margin:0 auto 18px;line-height:1.6;}
  .era-banner{text-align:center;margin-bottom:14px;}
  .era-banner .tag{font-size:12px;color:var(--muted);letter-spacing:0.5px;}
  .era-banner .title{font-size:24px;color:var(--gold);font-family:'Cormorant Garamond',serif;font-weight:600;}
  .hand{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
  .hand.two{grid-template-columns:repeat(2,1fr);}
  .card{border:1px solid var(--gold-dim);border-radius:4px;padding:14px 12px;cursor:pointer;background:var(--panel);text-align:left;transition:border-color .15s ease, transform .15s ease;}
  .card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .card.selected{border-color:var(--gold);background:#29271f;transform:translateY(-2px);box-shadow:0 0 0 1px var(--gold);}
  .card.busy{pointer-events:none;opacity:.55;}
  .card .kind{font-size:10px;letter-spacing:0.6px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
  .card .name{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--cream);margin-bottom:6px;}
  .card .effect{font-size:12px;color:var(--muted);line-height:1.4;}
  .role-pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;letter-spacing:0.4px;margin-bottom:10px;}
  .role-pill.troia{background:var(--troia-dim);color:var(--troia-light);}
  .role-pill.gregos{background:var(--gregos-dim);color:var(--gregos-light);}
  .error-banner{background:var(--error);color:#fff;padding:10px 14px;border-radius:3px;font-size:13px;margin-bottom:16px;text-align:center;}
  .share-hint{font-size:13px;color:var(--muted);margin-top:8px;}
  .divider-or{color:var(--muted);font-size:12px;margin:18px 0;text-align:center;}
  .quick-manual{margin:24px auto 0;max-width:640px;text-align:left;border:1px solid var(--gold-dim);border-radius:4px;background:rgba(29,34,36,.72);overflow:hidden;}
  .quick-manual summary{list-style:none;cursor:pointer;padding:13px 16px;color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;}
  .quick-manual summary::-webkit-details-marker{display:none;}
  .quick-manual summary:after{content:'+';float:right;font-family:'IBM Plex Sans',sans-serif;color:var(--muted);}
  .quick-manual[open] summary:after{content:'−';}
  .manual-body{border-top:1px solid var(--gold-dim);padding:14px 16px 16px;color:var(--cream);}
  .manual-body h3{font-size:17px;margin:14px 0 6px;color:var(--gold);}
  .manual-body h3:first-child{margin-top:0;}
  .manual-body p{margin:0 0 8px;max-width:none;color:var(--muted);line-height:1.55;}
  .manual-list{margin:0;padding-left:18px;color:var(--muted);font-size:14px;line-height:1.55;}
  .manual-list li{margin-bottom:6px;}
  .manual-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0;}
  .manual-side{border-left:3px solid var(--gold-dim);padding:8px 10px;background:#171B1D;}
  .manual-side.troia{border-left-color:var(--troia);}
  .manual-side.gregos{border-left-color:var(--gregos);}
  .manual-side b{display:block;margin-bottom:4px;color:var(--cream);}
  .manual-side span{display:block;color:var(--muted);font-size:13px;line-height:1.45;}
  .battle-map{margin-bottom:18px;}
  .battle-map-title{text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px;letter-spacing:0.4px;}
  .battle-map-row{display:flex;align-items:center;justify-content:center;gap:4px;}
  .battle-map-row.board-view{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"muralhas portoes" "planicie acampamento";gap:8px;max-width:520px;margin:0 auto;}
  .battle-node{flex:1;max-width:150px;text-align:center;padding:10px 6px;border-radius:3px;background:var(--panel);border:1px solid var(--gold-dim);opacity:0.55;transition:opacity .2s ease, border-color .2s ease;}
  .battle-map-row.board-view .battle-node{max-width:none;min-height:82px;display:flex;flex-direction:column;justify-content:center;}
  .battle-node.active{opacity:1;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
  .battle-node-icon{font-size:22px;margin-bottom:4px;}
  .battle-node-label{font-size:10px;color:var(--cream);line-height:1.3;}
  .battle-node-arrow{color:var(--muted);font-size:12px;}
  .battle-map-hint{text-align:center;font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5;}
  .siege-board{margin-bottom:18px;}
  .defense-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
  .defense-tile{background:var(--panel);border:1px solid var(--gold-dim);border-radius:3px;padding:9px 8px;min-height:76px;}
  .defense-tile.inactive{opacity:.42;}
  .defense-tile.broken{border-color:var(--gregos);background:#261D1B;}
  .defense-name{font-size:12px;color:var(--cream);font-weight:600;margin-bottom:6px;}
  .pressure-dots{display:flex;gap:4px;min-height:9px;margin-bottom:5px;}
  .pressure-dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--gold-dim);background:transparent;}
  .pressure-dot.filled{background:var(--gold);}
  .defense-note{font-size:10px;color:var(--muted);line-height:1.3;}
  .chronicle-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px;}
  .chron-btn{background:none;border:1px solid var(--gold-dim);color:var(--ink);border-radius:3px;width:28px;height:28px;cursor:pointer;font-size:14px;line-height:1;padding:0;}
  .chron-btn:disabled{opacity:0.3;cursor:default;}
  .chron-cycle{font-size:12px;font-weight:600;letter-spacing:0.3px;}
  .resources-title{text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px;}
  .intro-video-overlay{position:fixed;inset:0;z-index:20;background:#070909;display:flex;align-items:center;justify-content:center;padding:20px;}
  .intro-video-panel{width:min(920px,100%);text-align:center;}
  .intro-video-panel video{width:100%;max-height:78vh;border:1px solid var(--gold-dim);background:#000;}
  .intro-video-actions{display:flex;justify-content:center;gap:10px;margin-top:12px;}
  .intro-slide{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--gold-dim);background:#000;overflow:hidden;}
  .intro-slide img{width:100%;height:100%;object-fit:contain;display:block;}
  .intro-slide-caption{position:absolute;left:0;right:0;bottom:0;padding:28px 18px 16px;background:linear-gradient(transparent,rgba(0,0,0,.88));font-family:'Cormorant Garamond',serif;font-size:22px;color:#fff;}
  .intro-progress{display:flex;justify-content:center;gap:7px;margin-top:12px;}
  .intro-progress span{width:26px;height:3px;background:#444;}
  .intro-progress span.active{background:var(--gold);}
  .campaign-board{position:relative;width:100%;aspect-ratio:3/2;margin:0 auto 18px;border:1px solid var(--gold-dim);overflow:hidden;background:#0b0e0f;isolation:isolate;}
  .campaign-board>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;}
  .campaign-board:after{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(54,12,8,.06),transparent 40%,transparent 60%,rgba(0,42,47,.08));}
  .board-phase{position:absolute;left:50%;top:2.5%;transform:translateX(-50%);min-width:180px;text-align:center;padding:7px 12px;background:rgba(9,12,12,.9);border:1px solid var(--gold);color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:clamp(13px,1.7vw,20px);}
  .board-counter{display:block;margin-top:2px;color:var(--cream);font-family:'IBM Plex Sans',sans-serif;font-size:clamp(8px,.85vw,11px);}
  .board-cluster{position:absolute;display:flex;gap:5px;flex-wrap:wrap;max-width:28%;}
  .board-cluster.gregos{left:6%;top:32%;}
  .board-cluster.troia{right:5%;top:31%;justify-content:flex-end;}
  .board-token{min-width:58px;padding:6px 8px;background:rgba(12,15,15,.9);border:1px solid var(--gold-dim);color:var(--cream);font-size:clamp(8px,1vw,12px);text-align:center;box-shadow:0 3px 9px rgba(0,0,0,.35);}
  .board-token strong{display:block;color:var(--gold);font-size:clamp(13px,1.7vw,20px);line-height:1;}
  .board-token.pulse{animation:token-arrive .55s ease-out;}
  @keyframes token-arrive{0%{transform:scale(.72);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  .board-preparations{position:absolute;left:6%;right:5%;bottom:7.5%;display:flex;justify-content:space-between;gap:12px;pointer-events:none;}
  .prep-list{display:flex;gap:4px;flex-wrap:wrap;width:42%;align-content:flex-end;}
  .prep-list.troia{justify-content:flex-end;}
  .prep-chip{padding:4px 7px;background:rgba(10,13,13,.88);border:1px solid var(--gold-dim);color:var(--cream);font-size:clamp(7px,.8vw,10px);white-space:nowrap;}
  .board-defense-markers{position:absolute;left:57.5%;top:57.5%;width:26%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
  .board-defense-marker{aspect-ratio:1;border:2px solid rgba(184,147,90,.55);background:rgba(9,12,12,.55);display:flex;align-items:center;justify-content:center;color:#8b8b7e;font-size:clamp(8px,1vw,12px);text-align:center;}
  .board-defense-marker.active{background:rgba(76,122,108,.82);border-color:#d2b475;color:#fff;}
  .army-marker{position:absolute;width:clamp(25px,4vw,48px);aspect-ratio:1;border-radius:50%;background:var(--gregos-dim);border:2px solid var(--gold);display:grid;place-items:center;font-size:clamp(11px,1.7vw,20px);box-shadow:0 0 0 4px rgba(0,0,0,.3);transition:left .45s ease,top .45s ease;}
  .army-marker.acampamento{left:19%;top:48%;}.army-marker.planicie{left:45%;top:49%;}.army-marker.muralhas{left:61%;top:47%;}.army-marker.portoes{left:84%;top:45%;}
  .board-message{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);padding:5px 10px;background:rgba(9,12,12,.9);color:var(--cream);font-size:clamp(8px,.9vw,11px);white-space:nowrap;}
  .game-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.75fr);gap:18px;align-items:start;}
  .game-side{min-width:0;}
  @media (max-width:640px){
    body{padding:22px 14px;}
    .manual-grid,.fronts{grid-template-columns:1fr;}
    .divider{display:none;}
    .action-grid,.action-grid.three,.hand,.hand.two{grid-template-columns:1fr;}
    .battle-map-row{align-items:stretch;}
    .battle-node-label{font-size:9px;}
    .defense-row{grid-template-columns:1fr 1fr;}
    .campaign-board{margin-left:-14px;width:calc(100% + 28px);border-left:0;border-right:0;}
    .board-cluster{max-width:34%;gap:2px}.board-token{min-width:42px;padding:4px 5px}.prep-chip{display:none}
  }
  @media (max-width:900px){.game-layout{grid-template-columns:1fr;}}
</style>
</head>
<body>
<h1>Guerra de Troia</h1>
<p class="subtitle">duelo online — cada jogador no seu próprio aparelho</p>
<div class="spear-rule"></div>
<div id="app"></div>
<script>
const API = '/.netlify/functions/room';
const KIND_ICON = {
  'Construção':'🏛️','Recurso':'🍎','Recrutamento':'⚔️','Sabedoria':'📜',
  'Equipamento':'🔥','Armadilha':'🕳️','Favor divino':'✨','Ritual':'🌊','Estratégia':'🧭'
};
const ACTION_LABEL = {avancar:'Avançar', recuar:'Recuar', atacar:'Atacar', reforcar:'Reforçar', buscar:'Buscar recursos', estratagema:'Estratagema'};
const LOCATION_LABEL = {muralhas:'Muralhas de Troia', planicie:'Planície', acampamento:'Acampamento Grego', portoes:'Portões de Troia'};
const LOCATION_ICON = {muralhas:'🏛️', planicie:'🌾', acampamento:'🏕️', portoes:'🚪'};
const LOCATION_ORDER = ['acampamento','planicie','muralhas','portoes'];
// Adicione aqui os PNGs da introdução. Com a lista vazia, o vídeo atual continua sendo usado.
const INTRO_SLIDES = [];

let session = null; // {code, role, token}
let view = null;
let localScreen = 'intro'; // intro | create | join | game
let errorMsg = null;
let pollTimer = null;
let logViewCycle = null;
let manualOpen = false;
let requestInFlight = false;
let pendingCardIndex = null;
let pendingAction = null;

function loadSession(){
  try {
    const raw = localStorage.getItem('troia-session');
    if(raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}
function saveSession(s){
  try { localStorage.setItem('troia-session', JSON.stringify(s)); } catch(e) {}
}
function clearSession(){
  try { localStorage.removeItem('troia-session'); } catch(e) {}
}

async function api(action, opts){
  opts = opts || {};
  const method = opts.method || 'GET';
  let url = API + '?action=' + encodeURIComponent(action);
  const fetchOpts = { method };
  if(method === 'GET'){
    const qs = new URLSearchParams(opts.params || {});
    url += '&' + qs.toString();
  } else {
    fetchOpts.headers = {'Content-Type':'application/json'};
    fetchOpts.body = JSON.stringify(opts.body || {});
  }
  const res = await fetch(url, fetchOpts);
  const data = await res.json().catch(()=>({error:'Resposta inválida do servidor.'}));
  if(!res.ok) throw new Error(data.error || 'Erro na requisição.');
  return data;
}

async function refreshState(){
  if(!session) return;
  if(requestInFlight) return;
  try {
    const previousPhase = view && view.phase;
    const data = await api('state', { params:{ code:session.code, role:session.role, token:session.token } });
    view = data;
    errorMsg = null;
    if(previousPhase === 'lobby' && view.phase === 'era-pick') playIntroVideo();
    if(!['siege-pick','siege-reveal','fim'].includes(view.phase)) logViewCycle = null;
    render();
  } catch(e){
    errorMsg = e.message;
    render();
  }
}

function startPolling(){
  stopPolling();
  pollTimer = setInterval(refreshState, 1800);
  refreshState();
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}

async function criarSala(){
  errorMsg = null;
  try {
    const data = await api('create', { method:'POST', body:{} });
    session = { code:data.code, role:data.role, token:data.token };
    saveSession(session);
    localScreen = 'game';
    startPolling();
  } catch(e){ errorMsg = e.message; render(); }
}

async function entrarSala(code){
  errorMsg = null;
  try {
    const data = await api('join', { method:'POST', body:{ code } });
    session = { code:data.code, role:data.role, token:data.token };
    saveSession(session);
    localScreen = 'game';
    startPolling();
  } catch(e){ errorMsg = e.message; render(); }
}

async function sairSala(){
  stopPolling();
  session = null; view = null; errorMsg = null;
  clearSession();
  localScreen = 'intro';
  render();
}

async function iniciarDuelo(){
  try {
    view = await api('start', { method:'POST', body: session });
    playIntroVideo();
    render();
  }
  catch(e){ errorMsg = e.message; render(); }
}
async function escolherCartaEra(idx){
  if(requestInFlight) return;
  requestInFlight = true;
  pendingCardIndex = idx;
  render();
  try { await api('pick-era', { method:'POST', body: Object.assign({index:idx}, session) }); }
  catch(e){ errorMsg = e.message; }
  finally { requestInFlight = false; pendingCardIndex = null; await refreshState(); }
}
async function continuarEra(){
  if(requestInFlight) return;
  requestInFlight = true;
  render();
  try { await api('advance-era', { method:'POST', body: session }); }
  catch(e){ errorMsg = e.message; }
  finally { requestInFlight = false; await refreshState(); }
}
async function escolherAcao(choice){
  if(requestInFlight) return;
  requestInFlight = true;
  pendingAction = choice;
  render();
  try { await api('pick-action', { method:'POST', body: Object.assign({choice}, session) }); }
  catch(e){ errorMsg = e.message; }
  finally { requestInFlight = false; pendingAction = null; await refreshState(); }
}
async function resolverCiclo(){
  if(requestInFlight) return;
  requestInFlight = true;
  render();
  try { await api('resolve-cycle', { method:'POST', body: session }); }
  catch(e){ errorMsg = e.message; }
  finally { requestInFlight = false; await refreshState(); }
}
async function novoDuelo(){
  try {
    view = await api('restart', { method:'POST', body: session });
    playIntroVideo();
    render();
  }
  catch(e){ errorMsg = e.message; render(); }
}

function playIntroVideo(){
  const old = document.getElementById('intro-video-overlay');
  if(old) old.remove();
  if(INTRO_SLIDES.length){
    playIntroSlides();
    return;
  }
  const overlay = document.createElement('div');
  overlay.className = 'intro-video-overlay';
  overlay.id = 'intro-video-overlay';
  overlay.innerHTML = `
    <div class="intro-video-panel">
      <video src="Midia/Introdução.mp4" autoplay playsinline controls></video>
      <div class="intro-video-actions">
        <button class="advance" onclick="window._closeIntroVideo()">Continuar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const video = overlay.querySelector('video');
  video.addEventListener('ended', ()=>window._closeIntroVideo());
  const started = video.play();
  if(started && started.catch) started.catch(()=>{ video.controls = true; });
}

let introSlideIndex = 0;
function playIntroSlides(){
  introSlideIndex = 0;
  const overlay = document.createElement('div');
  overlay.className = 'intro-video-overlay';
  overlay.id = 'intro-video-overlay';
  overlay.innerHTML = `<div class="intro-video-panel" id="intro-slide-panel"></div>`;
  document.body.appendChild(overlay);
  renderIntroSlide();
}

function renderIntroSlide(){
  const panel = document.getElementById('intro-slide-panel');
  if(!panel || !INTRO_SLIDES.length) return;
  const slide = INTRO_SLIDES[introSlideIndex];
  panel.innerHTML = `
    <div class="intro-slide">
      <img src="${slide.src}" alt="${slide.alt||'Introdução da campanha'}">
      ${slide.caption ? `<div class="intro-slide-caption">${slide.caption}</div>` : ''}
    </div>
    <div class="intro-progress">${INTRO_SLIDES.map((_,i)=>`<span class="${i===introSlideIndex?'active':''}"></span>`).join('')}</div>
    <div class="intro-video-actions">
      <button class="act" onclick="window._introPrev()" ${introSlideIndex===0?'disabled':''}>Anterior</button>
      <button class="advance" onclick="window._introNext()">${introSlideIndex===INTRO_SLIDES.length-1?'Começar':'Próximo'}</button>
      <button class="act" onclick="window._closeIntroVideo()">Pular</button>
    </div>`;
}

window._introPrev = function(){
  introSlideIndex = Math.max(0, introSlideIndex-1);
  renderIntroSlide();
};
window._introNext = function(){
  if(introSlideIndex >= INTRO_SLIDES.length-1) return window._closeIntroVideo();
  introSlideIndex += 1;
  renderIntroSlide();
};

window._closeIntroVideo = function(){
  const overlay = document.getElementById('intro-video-overlay');
  if(overlay) overlay.remove();
};

function campaignBoardHTML(options){
  const prep = options && options.prep;
  const r = prep ? view.resources : view.siege;
  if(!r) return '';
  const chosen = prep && r.chosenCards ? r.chosenCards : {troia:[],gregos:[]};
  const displayChosen = {
    troia:[...(chosen.troia||[])],
    gregos:[...(chosen.gregos||[])]
  };
  if(prep && view.pendingPreparation){
    displayChosen[view.role].push(view.pendingPreparation);
  }
  const defenses = prep
    ? {
        fosso:{active:!!(r.defenseCards && r.defenseCards.fosso)},
        torres:{active:!!(r.defenseCards && r.defenseCards.torres)},
        muralha:{active:true},
        pedras:{active:!!(r.defenseCards && r.defenseCards.pedras)}
      }
    : (r.defenses || {});
  const stage = prep ? stageTitle(view.eraStage) : `Ano ${r.cycle} — ${r.phaseOfYear}`;
  const counter = prep ? `Escolha ${view.eraRound} de ${view.eraRoundsTotal}` : `Manobra ${r.maneuver} de ${r.maneuversPerYear}`;
  const greekTroops = r.tropasGregos;
  const greekSupply = r.suprimentoGregos;
  const greekAttack = r.bonusAtaqueGregos || 0;
  const troyTroops = r.tropasTroia;
  const troySupply = r.suprimentoTroia;
  const troyDefense = r.bonusDefesaTroia || 0;
  const prepChips = side => displayChosen[side].map(c=>`<span class="prep-chip">${KIND_ICON[c.kind]||''} ${c.name}</span>`).join('');
  return `
    <div class="campaign-board" aria-label="Tabuleiro da campanha">
      <img src="Midia/Tabuleiro Digital.png" alt="Tabuleiro da Guerra de Troia visto de cima">
      <div class="board-phase">${stage}<span class="board-counter">${counter}</span></div>
      <div class="board-cluster gregos">
        <span class="board-token pulse"><strong>${greekTroops}</strong>Tropas</span>
        <span class="board-token"><strong>${greekSupply}</strong>Suprimento</span>
        <span class="board-token"><strong>+${greekAttack}</strong>Ataque</span>
      </div>
      <div class="board-cluster troia">
        <span class="board-token pulse"><strong>${troyTroops}</strong>Tropas</span>
        <span class="board-token"><strong>${troySupply}</strong>Suprimento</span>
        <span class="board-token"><strong>+${troyDefense}</strong>Defesa</span>
      </div>
      <div class="board-defense-markers">
        ${[['fosso','Fosso'],['torres','Torres'],['muralha','Muralha'],['pedras','Pedras']].map(([key,label])=>{
          const item = defenses[key] || {};
          const active = item.active && !item.broken;
          return `<span class="board-defense-marker ${active?'active':''}" title="${label}">${label}</span>`;
        }).join('')}
      </div>
      ${prep ? `<div class="board-preparations"><div class="prep-list gregos">${prepChips('gregos')}</div><div class="prep-list troia">${prepChips('troia')}</div></div>` : `<div class="army-marker ${r.greekPosition}" title="Posição do exército grego">⚔</div>`}
      <div class="board-message">${prep ? (view.phase==='era-reveal' ? 'As duas preparações foram incorporadas ao tabuleiro.' : view.picked || pendingCardIndex !== null ? 'Preparação confirmada. Aguardando o outro lado.' : 'Sua escolha altera o acampamento ou a cidadela.') : LOCATION_LABEL[r.greekPosition]}</div>
    </div>`;
}

async function criarSolo(role){
  errorMsg = null;
  try {
    const data = await api('create-solo', { method:'POST', body:{ role } });
    session = { code:data.code, role:data.role, token:data.token };
    saveSession(session);
    localScreen = 'game';
    playIntroVideo();
    startPolling();
  } catch(e){ errorMsg = e.message; render(); }
}

function defenseHTML(){
  const d = view.siege.defenses;
  if(!d) return '';
  const items = [
    ['fosso','Fosso','2 pressões removem a defesa'],
    ['torres','Torres','2 pressões neutralizam a vigilância'],
    ['muralha','Muralha','3 pressões rompem o caminho aos portões'],
    ['pedras','Pedras','Bônus defensivo; não recebe pressão']
  ];
  return `
    <div class="defense-row">
      ${items.map(([key,name,note])=>{
        const def = d[key] || {};
        const inactive = !def.active;
        const broken = !!def.broken;
        const max = def.max || 0;
        const pressure = def.pressure || 0;
        const dots = max
          ? `<div class="pressure-dots">${Array.from({length:max}).map((_,i)=>`<span class="pressure-dot ${i<pressure?'filled':''}"></span>`).join('')}</div>`
          : '<div class="pressure-dots"></div>';
        return `
          <div class="defense-tile ${inactive?'inactive':''} ${broken?'broken':''}">
            <div class="defense-name">${name}</div>
            ${dots}
            <div class="defense-note">${inactive ? 'não construída' : broken ? 'neutralizada' : note}</div>
          </div>`;
      }).join('')}
    </div>`;
}

function currentLogCycle(){
  const max = view.siege.cycle;
  if(logViewCycle === null || logViewCycle > max) return max;
  if(logViewCycle < 1) return 1;
  return logViewCycle;
}

function chronicleHTML(){
  const s = view.siege;
  if(!s || !s.cycleLogs) return '';
  const cyc = currentLogCycle();
  const entries = (s.cycleLogs[cyc] || []).slice().reverse();
  const canPrev = cyc > 1;
  const canNext = cyc < s.cycle;
  return `
  <div class="chronicle-box">
    <div class="chronicle-nav">
      <button class="chron-btn" onclick="navLog(-1)" ${canPrev?'':'disabled'}>‹</button>
      <span class="chron-cycle">Ano ${cyc}</span>
      <button class="chron-btn" onclick="navLog(1)" ${canNext?'':'disabled'}>›</button>
    </div>
    ${entries.length ? entries.map(e=>`<div class="entry">${e.html}</div>`).join('') : '<div class="entry" style="opacity:.6">Nenhum evento registrado.</div>'}
  </div>`;
}

window.navLog = function(delta){
  const max = view.siege.cycle;
  const cur = currentLogCycle();
  logViewCycle = Math.max(1, Math.min(max, cur+delta));
  render();
};

function render(){
  const app = document.getElementById('app');

  if(localScreen === 'intro'){
    app.innerHTML = `
      ${errorHTML()}
      <div class="setup">
        <p>Cada jogador entra pelo próprio celular ou computador — não precisa mais revezar o mesmo aparelho.
        Um dos lados cria a sala e manda o código pro outro entrar.</p>
        <button class="advance wide" style="max-width:280px;margin:0 auto;" onclick="window._go('create')">Criar sala</button>
        <div class="divider-or">ou</div>

        <div class="divider-or">modo solo</div>
        <div class="action-grid" style="max-width:420px;margin:0 auto;">
          <button class="act" onclick="criarSolo('troia')">Solo como Troia</button>
          <button class="act" onclick="criarSolo('gregos')">Solo como Gregos</button>
        </div>
        ${manualHTML(false)}
      </div>`;
    return;
  }

  if(localScreen === 'create'){
    app.innerHTML = `
      ${errorHTML()}
      <div class="setup">
        <p>Você vai jogar como <b>Troia</b>. Clique abaixo pra gerar o código da sala e compartilhar com quem vai jogar dos Gregos.</p>
        <button class="advance wide" style="max-width:280px;margin:0 auto;" onclick="criarSala()">Gerar código da sala</button>
        <p class="share-hint"><a href="#" onclick="window._go('intro');return false;" style="color:var(--muted);">voltar</a></p>
      </div>`;
    return;
  }

  if(localScreen === 'join'){
    app.innerHTML = `
      ${errorHTML()}
      <div class="setup">
        <p>Você vai jogar como os <b>Gregos</b>. Digite o código de 5 letras que o outro jogador te passou.</p>
        <input class="code-input" id="join-code" maxlength="5" placeholder="XXXXX" autofocus>

    const actions = v.actions;
    app.innerHTML = `
      ${errorHTML()}
      <span class="role-pill ${v.role}">Você é ${v.role==='troia'?'Troia':'os Gregos'}</span>
      <div class="cycle-header"><div class="label">Ano ${v.siege.cycle} — ${v.siege.phaseOfYear} (${v.siege.maneuver}/${v.siege.maneuversPerYear})</div><div class="phase">Fase de planejamento</div></div>
      ${manualHTML(true)}
      ${statsHTML()}
      ${siegeBoardHTML()}
      ${chronicleHTML()}
      <div class="actions">
        <div class="action-prompt">Escolha sua manobra:</div>
        <div class="action-grid ${actions.length===3?'three':''}">
          ${actions.map(a=>`<button class="act" onclick="escolherAcao('${a}')" ${requestInFlight?'disabled':''}>${pendingAction===a?'Confirmando...':ACTION_LABEL[a]}</button>`).join('')}
        </div>
        <div class="battle-map-hint">
          Gregos avançam pela trilha até as muralhas. Troia pode atacar o acampamento, reforçar defesas ou tentar estratagema.
        </div>
      </div>`;
    return;
  }

  if(v.phase === 'siege-reveal'){
    const la = v.lastActions;
    const resolveLabel = v.siege.maneuver >= v.siege.maneuversPerYear ? 'Resolver manobra e inverno' : 'Resolver manobra';
    app.innerHTML = `
      ${errorHTML()}
      <div class="cycle-header"><div class="label">Ano ${v.siege.cycle} — ${v.siege.phaseOfYear} (${v.siege.maneuver}/${v.siege.maneuversPerYear})</div><div class="phase">Revelação</div></div>
      ${statsHTML()}
      ${siegeBoardHTML('Posição antes da resolução')}
      <div class="reveal-box">
        <div class="reveal-item troia"><div class="who">Troia</div><div class="act-name">${ACTION_LABEL[la.troia]}</div></div>
        <div class="reveal-item gregos"><div class="who">Gregos</div><div class="act-name">${ACTION_LABEL[la.gregos]}</div></div>
      </div>
      <div style="text-align:center;"><button class="advance" onclick="resolverCiclo()">${resolveLabel}</button></div>
    `;
    return;
  }

  if(v.phase === 'fim'){
    const venceu = v.siege.gameOver;
    const textos = {
      tropas: venceu==='troia' ? 'O exército grego se dissolveu por completo — sem homens, o cerco não pode continuar.' : 'A guarnição de Troia foi reduzida a nada — a cidade não tem mais quem a defenda.',
      moral: 'Sem vitórias suficientes para justificar mais um ano longe de casa, o acampamento grego se desfaz.',
      portoes: 'As defesas foram superadas e os portões não resistiram ao assalto final.'
    };
    app.innerHTML = `
      ${errorHTML()}
      <div class="cycle-header"><div class="label">Ano ${v.siege.cycle} — fim do cerco</div></div>
      ${statsHTML()}
      ${siegeBoardHTML()}
      ${chronicleHTML()}
      <div class="endgame">
        <h2>${venceu==='troia' ? 'Troia resiste' : 'O cerco vence'}</h2>
        <p>${textos[v.siege.reason]||''}</p>
        <button class="restart" onclick="novoDuelo()">Novo duelo</button>
      </div>`;
    return;
  }
}

window._go = function(screen){ errorMsg = null; localScreen = screen; render(); };
window._joinFromInput = function(){
  const input = document.getElementById('join-code');
  const code = (input.value || '').trim();
  if(!code){ errorMsg = 'Digite o código da sala.'; render(); return; }
  entrarSala(code);
};

(function init(){
  const saved = loadSession();
  if(saved){
    session = saved;
    localScreen = 'game';
    startPolling();
  } else {
    render();
  }
})();
</script>
</body>
</html>
