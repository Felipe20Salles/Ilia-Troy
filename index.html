<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Guerra de Troia — Duelo local</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14181A; --panel:#1D2224; --parchment:#E7DCC2; --ink:#26211A;
    --gold:#B8935A; --gold-dim:#7A6440;
    --troia:#4C7A6C; --troia-dim:#2E4A41; --troia-light:#A9CBBE;
    --gregos:#9A4235; --gregos-dim:#63241C; --gregos-light:#E3B2A6;
    --cream:#E8E3D3; --muted:#8B8B7E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:'IBM Plex Sans',sans-serif;padding:28px 20px;max-width:760px;margin:0 auto;}
  h1,h3{font-family:'Cormorant Garamond',serif;}
  h1{font-size:32px;font-weight:600;margin:0 0 4px;color:var(--gold);text-align:center;}
  .subtitle{text-align:center;color:var(--muted);margin:0 0 24px;font-style:italic;font-family:'Cormorant Garamond',serif;font-size:16px;}
  .spear-rule{height:1px;background:linear-gradient(to right,transparent,var(--gold-dim),transparent);margin:16px 0;}
  .setup{text-align:center;padding:16px 0;}
  .setup p{color:var(--muted);line-height:1.6;max-width:520px;margin:0 auto 20px;}
  button.act, button.advance, button.restart, button.wide{
    padding:13px 18px;border-radius:3px;border:1px solid var(--gold-dim);background:var(--panel);color:var(--cream);
    font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s ease;
  }
  button.act:hover, button.wide:hover{background:#262C2E;border-color:var(--gold);}
  button.advance{border-color:var(--gold);background:var(--gold-dim);color:#14181A;font-weight:600;}
  button.advance:hover{background:var(--gold);}
  button.wide{width:100%;}
  .pass-screen{text-align:center;padding:60px 20px;}
  .pass-icon{font-size:56px;margin-bottom:18px;}
  .pass-screen h2{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold);margin:0 0 10px;}
  .pass-screen p{color:var(--muted);margin:0 0 26px;}
  .cycle-header{text-align:center;margin-bottom:16px;}
  .cycle-header .label{font-size:13px;color:var(--muted);letter-spacing:0.5px;}
  .cycle-header .phase{font-size:22px;color:var(--gold);font-family:'Cormorant Garamond',serif;font-weight:600;}
  .fronts{display:grid;grid-template-columns:1fr 1px 1fr;gap:18px;margin-bottom:18px;}
  .divider{background:linear-gradient(180deg,transparent,var(--gold-dim),transparent);}
  .front{padding:14px 16px;border-radius:3px;background:var(--panel);}
  .front.troia{border-left:3px solid var(--troia);}
  .front.gregos{border-left:3px solid var(--gregos);}
  .front h3{margin:0 0 10px;font-size:18px;font-weight:600;}
  .front.troia h3{color:var(--troia-light);}
  .front.gregos h3{color:var(--gregos-light);}
  .front.active{outline:1px solid var(--gold);}
  .stat-row{margin-bottom:9px;}
  .stat-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px;}
  .bar-track{height:7px;background:#0F1213;border-radius:2px;overflow:hidden;}
  .bar-fill{height:100%;transition:width .4s ease;}
  .bar-fill.troia{background:var(--troia);}
  .bar-fill.gregos{background:var(--gregos);}
  .small-stats{display:flex;gap:12px;margin-top:10px;font-size:13px;color:var(--cream);flex-wrap:wrap;}
  .small-stats span b{color:var(--muted);font-weight:400;font-size:11px;display:flex;align-items:center;gap:4px;}
  .chronicle-box{background:var(--parchment);color:var(--ink);border-radius:3px;padding:14px 16px;margin-bottom:18px;max-height:210px;overflow-y:auto;}
  .chronicle-box .entry{font-size:15px;line-height:1.5;margin-bottom:9px;font-family:'Cormorant Garamond',serif;}
  .chronicle-box .entry:last-child{margin-bottom:0;}
  .chronicle-box .entry .tag{font-weight:600;}
  .chronicle-box .entry .tag.troia{color:var(--troia-dim);}
  .chronicle-box .entry .tag.gregos{color:var(--gregos-dim);}
  .actions{text-align:center;}
  .action-prompt{font-size:14px;color:var(--muted);margin-bottom:12px;}
  .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .action-grid.three{grid-template-columns:1fr 1fr 1fr;}
  .reveal-box{display:flex;justify-content:space-around;margin-bottom:18px;}
  .reveal-item{text-align:center;}
  .reveal-item .who{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .reveal-item .act-name{font-size:19px;font-family:'Cormorant Garamond',serif;font-weight:600;}
  .reveal-item.troia .act-name{color:var(--troia-light);}
  .reveal-item.gregos .act-name{color:var(--gregos-light);}
  .endgame{text-align:center;padding:16px 0;}
  .endgame h2{font-size:28px;margin:0 0 10px;color:var(--gold);}
  .endgame p{color:var(--muted);max-width:480px;margin:0 auto 18px;line-height:1.6;}
  .era-banner{text-align:center;margin-bottom:14px;}
  .era-banner .tag{font-size:12px;color:var(--muted);letter-spacing:0.5px;}
  .era-banner .title{font-size:24px;color:var(--gold);font-family:'Cormorant Garamond',serif;font-weight:600;}
  .hand{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
  .hand.two{grid-template-columns:repeat(2,1fr);}
  .card{border:1px solid var(--gold-dim);border-radius:4px;padding:14px 12px;cursor:pointer;background:var(--panel);text-align:left;transition:border-color .15s ease, transform .15s ease;}
  .card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .card .kind{font-size:10px;letter-spacing:0.6px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
  .card .name{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--cream);margin-bottom:6px;}
  .card .effect{font-size:12px;color:var(--muted);line-height:1.4;}
  .role-pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;letter-spacing:0.4px;margin-bottom:10px;}
  .role-pill.troia{background:var(--troia-dim);color:var(--troia-light);}
  .role-pill.gregos{background:var(--gregos-dim);color:var(--gregos-light);}
</style>
</head>
<body>
<h1>Guerra de Troia</h1>
<p class="subtitle">duelo local — revezem o mesmo aparelho a cada escolha</p>
<div class="spear-rule"></div>
<div id="app"></div>
<script>
const KIND_ICON = {
  'Construção':'🏛️','Recurso':'🍎','Recrutamento':'⚔️','Sabedoria':'📜',
  'Equipamento':'🔥','Armadilha':'🕳️','Favor divino':'✨','Ritual':'🌊','Estratégia':'🧭'
};

const DECKS = {
  troia: {
    era1: [
      {kind:'Construção', name:'Muralha de pedra', effect:'+2 resistência estrutural', apply:s=>{s.resistenciaEstrutural+=2;}},
      {kind:'Construção', name:'Torres de vigia', effect:'+2 resistência estrutural', apply:s=>{s.resistenciaEstrutural+=2;}},
      {kind:'Construção', name:'Fosso de contenção', effect:'+1 resistência estrutural', apply:s=>{s.resistenciaEstrutural+=1;}},
      {kind:'Construção', name:'Pedras do alto', effect:'+1 resistência estrutural', apply:s=>{s.resistenciaEstrutural+=1;}},
      {kind:'Recurso', name:'Celeiros reais', effect:'+6 suprimento em estoque', apply:s=>{s.suprimentoTroia+=6;}},
      {kind:'Recurso', name:'Poços internos', effect:'+4 suprimento em estoque', apply:s=>{s.suprimentoTroia+=4;}},
      {kind:'Recrutamento', name:'Guarnição da cidade', effect:'+3 tropas', apply:s=>{s.tropasTroia+=3;}},
      {kind:'Sabedoria', name:'Conselho dos sábios', effect:'Estratagema mais eficaz durante o cerco', apply:s=>{s.estratagemaForteTroia=true;}},
      {kind:'Estratégia', name:'Racionamento estrito', effect:'Consumo de suprimento reduzido em 30% durante todo o cerco', apply:s=>{s.racionamentoAtivo=true;}}
    ],
    era2: [
      {kind:'Armadilha', name:'Armadilhas na praia', effect:'Gregos perdem 2 tropas na travessia', apply:s=>{s.tropasGregos=Math.max(0,s.tropasGregos-2);}},
      {kind:'Favor divino', name:'Favor de Apolo', effect:'+1 resistência estrutural', apply:s=>{s.resistenciaEstrutural+=1;}},
      {kind:'Armadilha', name:'Emboscada noturna', effect:'Gregos perdem 1 tropa, Troia ganha 2 suprimento', apply:s=>{s.tropasGregos=Math.max(0,s.tropasGregos-1); s.suprimentoTroia+=2;}}
    ]
  },
  gregos: {
    era1: [
      {kind:'Recrutamento', name:'Recrutas de Micenas', effect:'+3 tropas', apply:s=>{s.tropasGregos+=3;}},
      {kind:'Recurso', name:'Grão de Ftia', effect:'+5 suprimento em estoque', apply:s=>{s.suprimentoGregos+=5;}},
      {kind:'Sabedoria', name:'Conselho de Nestor', effect:'Estratagema mais eficaz durante o cerco', apply:s=>{s.estratagemaForteGregos=true;}},
      {kind:'Recrutamento', name:'Mirmidões de Ftia', effect:'+4 tropas', apply:s=>{s.tropasGregos+=4;}},
      {kind:'Equipamento', name:'Forjas de bronze', effect:'+1 bônus de ataque permanente', apply:s=>{s.bonusAtaqueGregos+=1;}},
      {kind:'Recrutamento', name:'Contingente de Salamina', effect:'+2 tropas', apply:s=>{s.tropasGregos+=2;}}
    ],
    era2: [
      {kind:'Equipamento', name:'Aríete de guerra', effect:'+1 bônus de ataque adicional', apply:s=>{s.bonusAtaqueGregos+=1;}},
      {kind:'Equipamento', name:'Torres de cerco', effect:'Reduz a resistência estrutural de Troia em 1', apply:s=>{s.resistenciaEstrutural=Math.max(0,s.resistenciaEstrutural-1);}},
      {kind:'Ritual', name:'Sacrifício a Posêidon', effect:'+2 tropas (travessia segura)', apply:s=>{s.tropasGregos+=2;}},
      {kind:'Favor divino', name:'Marés favoráveis', effect:'+1 determinação inicial', apply:s=>{s.determinacao=(s.determinacao||2)+1;}},
      {kind:'Favor divino', name:'Aquiles retorna ao combate', effect:'+2 determinação inicial', apply:s=>{s.determinacao=(s.determinacao||2)+2;}}
    ]
  }
};

const ERA_ROUNDS = {era1:5, era2:3};
const TROIA_ACTIONS = ['atacar','reforcar','estratagema'];
const GREGOS_ACTIONS = ['atacar','reforcar','buscar','estratagema'];
const ACTION_LABEL = {atacar:'Atacar', reforcar:'Reforçar', buscar:'Buscar recursos', estratagema:'Estratagema'};

function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function otherSide(s){ return s==='troia'?'gregos':'troia'; }
function dmgTroops(){ return 2+Math.floor(Math.random()*2); }

let state = {
  eraStage:'era1', eraRound:1,
  eraStats:{resistenciaEstrutural:0,estratagemaForteTroia:false,racionamentoAtivo:false,tropasTroia:8,suprimentoTroia:4,bonusAtaqueGregos:0,estratagemaForteGregos:false,tropasGregos:8,suprimentoGregos:4,determinacao:2}
};
const deckUsed = {troia:[], gregos:[]};
let screen = 'intro';
let turn = 'troia';
let hand = [];
let tempEraPick = null;
let tempAction = null;

function drawHand(side){
  const era = state.eraStage;
  const size = era==='era1' ? 3 : 2;
  const pool = DECKS[side][era].filter(c=>!deckUsed[side].includes(c.name));
  const shuffled = [...pool].sort(()=>Math.random()-0.5);
  hand = shuffled.slice(0, Math.min(size, shuffled.length));
}

function goPass(nextTurn, nextScreen){
  turn = nextTurn;
  screen = 'pass';
  window._afterPass = nextScreen;
  render();
}
function afterPass(){
  screen = window._afterPass;
  if(screen === 'era-pick') drawHand(turn);
  render();
}

function startGame(){
  goPass('troia', 'era-pick');
}

function pickEraCard(idx){
  const card = hand[idx];
  deckUsed[turn].push(card.name);
  if(turn === 'troia'){
    tempEraPick = card;
    goPass('gregos', 'era-pick');
  } else {
    const troiaCard = tempEraPick;
    troiaCard.apply(state.eraStats);
    card.apply(state.eraStats);
    window._lastEraReveal = {troia:troiaCard, gregos:card};
    tempEraPick = null;
    screen = 'era-reveal';
    render();
  }
}

function advanceEraRound(){
  if(state.eraRound < ERA_ROUNDS[state.eraStage]){
    state.eraRound += 1;
    goPass('troia', 'era-pick');
  } else if(state.eraStage === 'era1'){
    state.eraStage = 'era2';
    state.eraRound = 1;
    goPass('troia', 'era-pick');
  } else {
    initSiege(state);
    goPass('troia', 'siege-pick');
  }
}

function addLog(r, html){ r.log.unshift({html}); if(r.log.length>30) r.log.pop(); }

function initSiege(r){
  const s = r.eraStats;
  r.resistenciaEstrutural = s.resistenciaEstrutural;
  r.estratagemaForteTroia = s.estratagemaForteTroia;
  r.racionamentoAtivo = s.racionamentoAtivo;
  r.tropasTroia = s.tropasTroia;
  r.suprimentoTroia = s.suprimentoTroia;
  r.bonusAtaqueGregos = s.bonusAtaqueGregos;
  r.estratagemaForteGregos = s.estratagemaForteGregos;
  r.tropasGregos = s.tropasGregos;
  r.suprimentoGregos = s.suprimentoGregos;
  r.determinacao = clamp(s.determinacao, 0, 16);
  r.determinacaoMax = 16;
  r.ociosidadeGregos = 0;
  r.cycle = 1;
  r.log = [];
  r.gameOver = null; r.reason = null;

  if(r.tropasGregos >= r.tropasTroia*2){
    r.determinacao = clamp(r.determinacao+1, 0, r.determinacaoMax);
    addLog(r, `<span class="tag gregos">Gregos</span> — o exército reunido é esmagadoramente superior; a confiança sobe antes mesmo do primeiro combate.`);
  }
  addLog(r, `As primeiras tropas gregas tocam a praia. O cerco de Troia começa — resistência estrutural fixada em ${r.resistenciaEstrutural}.`);
  resolveSupply(r);
  r.tropasTroiaMax = r.tropasTroia;
  r.tropasGregosMax = r.tropasGregos;
  r.fim = checkCollapse(r);
}

function checkCollapse(r){
  if(r.tropasTroia<=0){ r.gameOver='gregos'; r.reason='tropas'; return true; }
  if(r.tropasGregos<=0){ r.gameOver='troia'; r.reason='tropas'; return true; }
  if(r.determinacao<=0){ r.gameOver='troia'; r.reason='moral'; return true; }
  return false;
}

function resolveSupply(r){
  let consumoT = Math.ceil(r.tropasTroia/3);
  const consumoG = Math.ceil(r.tropasGregos/3);
  if(r.racionamentoAtivo) consumoT = Math.ceil(consumoT*0.7);
  r.suprimentoGregos += 1;
  if(r.suprimentoTroia < consumoT){
    const deficit = consumoT - r.suprimentoTroia;
    r.tropasTroia = Math.max(0, r.tropasTroia-deficit);
    r.suprimentoTroia = 0;
    addLog(r, `<span class="tag troia">Troia</span> — o estoque não é mais reabastecido de fora; a fome cobra ${deficit} soldado(s).`);
  } else {
    r.suprimentoTroia -= consumoT;
    addLog(r, `<span class="tag troia">Troia</span> — a cidade ainda vive do que armazenou antes do cerco começar.`);
  }
  if(r.suprimentoGregos < consumoG){
    const deficit = consumoG - r.suprimentoGregos;
    r.tropasGregos = Math.max(0, r.tropasGregos-deficit);
    r.determinacao = clamp(r.determinacao-1, 0, r.determinacaoMax);
    r.suprimentoGregos = 0;
    addLog(r, `<span class="tag gregos">Gregos</span> — falta suprimento mesmo com os navios de reforço; ${deficit} homem(ns) perdido(s), a moral cai.`);
  } else {
    r.suprimentoGregos -= consumoG;
    addLog(r, `<span class="tag gregos">Gregos</span> — os navios seguem trazendo o mínimo necessário.`);
  }
  if(r.ociosidadeGregos>=2){
    r.determinacao = clamp(r.determinacao-1,0,r.determinacaoMax);
    addLog(r, `<span class="tag gregos">Gregos</span> — homens longe de casa, sem combate há tempos, começam a duvidar da guerra.`);
  }
}

function affordReforcar(r, side){
  const field = side==='troia' ? 'suprimentoTroia' : 'suprimentoGregos';
  if(r[field]>=1){ r[field]-=1; return true; }
  return false;
}

function resolveActions(r, troiaAct, gregosAct){
  const troiaReforcou = troiaAct==='reforcar' && affordReforcar(r,'troia');
  const gregosReforcou = gregosAct==='reforcar' && affordReforcar(r,'gregos');
  if(troiaAct==='reforcar' && !troiaReforcou) addLog(r, `<span class="tag troia">Troia</span> tenta reforçar, mas não há suprimento — a fortificação não melhora este ciclo.`);
  if(gregosAct==='reforcar' && !gregosReforcou) addLog(r, `<span class="tag gregos">Gregos</span> tentam consolidar posição, mas faltam recursos.`);

  if(gregosAct==='atacar'){
    const tempBonus = troiaReforcou ? 1 : 0;
    if(troiaAct==='estratagema'){
      const anulado = r.estratagemaForteTroia ? Math.random()<0.75 : Math.random()<0.5;
      if(anulado){
        r.determinacao = clamp(r.determinacao-1,0,r.determinacaoMax);
        addLog(r, `Espiões troianos previram o ataque grego — o assalto se dissolve, e o fracasso abala a moral do acampamento.`);
      } else {
        const lt = dmgTroops();
        r.tropasTroia = Math.max(0, r.tropasTroia-lt);
        addLog(r, `A previsão falha — o ataque grego ainda causa ${lt} baixa(s) troiana(s).`);
      }
    } else {
      const mult = 1 + (r.resistenciaEstrutural + tempBonus)*0.2;
      const defesaEfetiva = r.tropasTroia * mult;
      const ratio = defesaEfetiva>0 ? r.tropasGregos/defesaEfetiva : 99;
      if(ratio>=1.5){
        const dano = dmgTroops()+r.bonusAtaqueGregos+2;
        r.tropasTroia = Math.max(0, r.tropasTroia-dano);
        r.resistenciaEstrutural = Math.max(0, r.resistenciaEstrutural-1);
        r.determinacao = clamp(r.determinacao+1,0,r.determinacaoMax);
        addLog(r, `Com força esmagadora, os gregos rompem um trecho da muralha — ${dano} baixa(s) troiana(s), a estrutura se degrada permanentemente.`);
      } else if(ratio>=0.8){
        const dano = Math.max(1, Math.floor((dmgTroops()+r.bonusAtaqueGregos)/2));
        r.tropasTroia = Math.max(0, r.tropasTroia-dano);
        addLog(r, `Um assalto equilibrado contra as defesas troianas — ${dano} baixa(s), mas a estrutura resiste.`);
      } else {
        const contraDano = dmgTroops()+tempBonus;
        r.tropasGregos = Math.max(0, r.tropasGregos-contraDano);
        r.determinacao = clamp(r.determinacao-1,0,r.determinacaoMax);
        addLog(r, `"Um homem na muralha vale por dez" — o ataque grego é repelido com ${contraDano} baixa(s) e um golpe na moral.`);
      }
    }
  }

  if(troiaAct==='atacar'){
    let dano = dmgTroops(); let saque=0;
    if(gregosReforcou){
      dano = Math.max(1, dano-1);
      addLog(r, `Troia avança contra o acampamento reforçado — ${dano} baixa(s) grega(s).`);
    } else if(gregosAct==='buscar'){
      dano += 2;
      saque = Math.floor(r.suprimentoGregos/3);
      r.suprimentoGregos -= saque; r.suprimentoTroia += saque;
      r.determinacao = clamp(r.determinacao-1,0,r.determinacaoMax);
      addLog(r, `Com metade do exército grego fora buscando recursos, Troia ataca o acampamento exposto — ${dano} baixa(s) e saque de ${saque} suprimento(s).`);
    } else if(gregosAct==='estratagema'){
      const anulado = r.estratagemaForteGregos ? Math.random()<0.75 : Math.random()<0.5;
      if(anulado){
        dano=0;
        r.determinacao = clamp(r.determinacao+1,0,r.determinacaoMax);
        addLog(r, `Odisseu antecipa a manobra troiana — a investida se perde, e a confiança do acampamento cresce.`);
      } else { addLog(r, `A antecipação grega falha — o ataque troiano causa ${dano} baixa(s).`); }
    } else if(gregosAct==='atacar'){
      addLog(r, `Enquanto os gregos avançam, uma investida troiana atinge suas linhas por trás — ${dano} baixa(s) grega(s) adicionais.`);
    }
    if(dano>0) r.tropasGregos = Math.max(0, r.tropasGregos-dano);
  }

  if(troiaAct!=='atacar' && gregosAct!=='atacar'){
    if(troiaAct==='reforcar' && gregosAct==='reforcar'){
      addLog(r, `Ciclo sem confronto direto — os dois lados recuperam o fôlego.`);
    } else if(gregosAct==='buscar'){
      const ganho = Math.ceil(r.tropasGregos/2);
      r.suprimentoGregos += ganho;
      addLog(r, `Navios gregos retornam da costa com +${ganho} suprimento.`);
    } else {
      addLog(r, `Ciclo tenso, sem grandes movimentos.`);
    }
  }
  r.ociosidadeGregos = gregosAct==='atacar' ? 0 : r.ociosidadeGregos+1;
}

function pickAction(action){
  if(turn === 'troia'){
    tempAction = action;
    goPass('gregos', 'siege-pick');
  } else {
    window._lastActions = {troia:tempAction, gregos:action};
    tempAction = null;
    screen = 'siege-reveal';
    render();
  }
}

function resolverCiclo(){
  const r = state;
  resolveActions(r, window._lastActions.troia, window._lastActions.gregos);
  if(checkCollapse(r)){
    r.fim = true;
    screen = 'fim';
    render();
    return;
  }
  r.cycle += 1;
  resolveSupply(r);
  if(checkCollapse(r)){ r.fim = true; screen = 'fim'; render(); return; }
  goPass('troia', 'siege-pick');
}

function novoDuelo(){
  state = {
    eraStage:'era1', eraRound:1,
    eraStats:{resistenciaEstrutural:0,estratagemaForteTroia:false,racionamentoAtivo:false,tropasTroia:8,suprimentoTroia:4,bonusAtaqueGregos:0,estratagemaForteGregos:false,tropasGregos:8,suprimentoGregos:4,determinacao:2}
  };
  deckUsed.troia = []; deckUsed.gregos = [];
  startGame();
}

function statsHTML(){
  const r = state;
  return `
  <div class="fronts">
    <div class="front troia ${turn==='troia'&&(screen==='era-pick'||screen==='siege-pick')?'active':''}">
      <h3>🏛️ Troia</h3>
      <div class="stat-row">
        <div class="stat-label"><span>Tropas</span><span>${r.tropasTroia}/${r.tropasTroiaMax||'-'}</span></div>
        <div class="bar-track"><div class="bar-fill troia" style="width:${r.tropasTroiaMax? r.tropasTroia/r.tropasTroiaMax*100:0}%"></div></div>
      </div>
      <div class="small-stats">
        <span><b>🍎 Suprimento</b>${r.suprimentoTroia}</span>
        <span><b>🏰 Resistência</b>${r.resistenciaEstrutural||0}</span>
      </div>
    </div>
    <div class="divider"></div>
    <div class="front gregos ${turn==='gregos'&&(screen==='era-pick'||screen==='siege-pick')?'active':''}">
      <h3>⛺ Gregos</h3>
      <div class="stat-row">
        <div class="stat-label"><span>Determinação</span><span>${r.determinacao}/${r.determinacaoMax||16}</span></div>
        <div class="bar-track"><div class="bar-fill gregos" style="width:${r.determinacaoMax? r.determinacao/r.determinacaoMax*100:0}%"></div></div>
      </div>
      <div class="small-stats">
        <span><b>⚔️ Tropas</b>${r.tropasGregos}</span>
        <span><b>🍎 Suprimento</b>${r.suprimentoGregos}</span>
        <span><b>🔥 Ataque</b>+${r.bonusAtaqueGregos}</span>
      </div>
    </div>
  </div>`;
}

function chronicleHTML(){
  if(!state.log || state.log.length===0) return '';
  return `<div class="chronicle-box">${state.log.map(e=>`<div class="entry">${e.html}</div>`).join('')}</div>`;
}

function render(){
  const app = document.getElementById('app');

  if(screen === 'intro'){
    app.innerHTML = `
      <div class="setup">
        <p>Vocês dois vão revezar este mesmo aparelho. A cada escolha, o app vai pedir pra passar
        o celular pra outra pessoa antes de mostrar as opções — assim ninguém vê a jogada do
        adversário antes da hora.</p>
        <button class="advance wide" style="max-width:280px;margin:0 auto;" onclick="startGame()">Começar duelo</button>
      </div>`;
    return;
  }

  if(screen === 'pass'){
    const nome = turn==='troia' ? 'quem vai jogar de Troia' : 'quem vai jogar dos Gregos';
    app.innerHTML = `
      <div class="pass-screen">
        <div class="pass-icon">${turn==='troia'?'🏛️':'⛺'}</div>
        <h2>Passe o celular</h2>
        <p>Entregue o aparelho para ${nome}.</p>
        <button class="advance" onclick="afterPass()">Estou com o celular</button>
      </div>`;
    return;
  }

  if(screen === 'era-pick'){
    const handClass = hand.length===2 ? 'hand two' : 'hand';
    app.innerHTML = `
      <span class="role-pill ${turn}">Vez de ${turn==='troia'?'Troia':'os Gregos'}</span>
      <div class="era-banner">
        <div class="tag">Rodada ${state.eraRound} de ${ERA_ROUNDS[state.eraStage]}</div>
        <div class="title">${state.eraStage==='era1' ? 'Era I — Preparação' : 'Era II — Travessia'}</div>
      </div>
      <div class="actions">
        <div class="action-prompt">Escolha uma carta desta rodada:</div>
        <div class="${handClass}">
          ${hand.map((c,i)=>`
            <div class="card" onclick="pickEraCard(${i})">
              <div class="kind">${KIND_ICON[c.kind]||''} ${c.kind}</div>
              <div class="name">${c.name}</div>
              <div class="effect">${c.effect}</div>
            </div>`).join('')}
        </div>
      </div>`;
    return;
  }

  if(screen === 'era-reveal'){
    const rv = window._lastEraReveal;
    app.innerHTML = `
      <div class="era-banner">
        <div class="tag">Rodada ${state.eraRound} de ${ERA_ROUNDS[state.eraStage]}</div>
        <div class="title">${state.eraStage==='era1' ? 'Era I — Preparação' : 'Era II — Travessia'}</div>
      </div>
      <div class="reveal-box">
        <div class="reveal-item troia"><div class="who">Troia</div><div class="act-name">${rv.troia.name}</div></div>
        <div class="reveal-item gregos"><div class="who">Gregos</div><div class="act-name">${rv.gregos.name}</div></div>
      </div>
      <div style="text-align:center;"><button class="advance" onclick="advanceEraRound()">Continuar</button></div>
    `;
    return;
  }

  if(screen === 'siege-pick'){
    const actions = turn==='troia' ? TROIA_ACTIONS : GREGOS_ACTIONS;
    app.innerHTML = `
      <span class="role-pill ${turn}">Vez de ${turn==='troia'?'Troia':'os Gregos'}</span>
      <div class="cycle-header"><div class="label">Cerco — ciclo ${state.cycle}</div><div class="phase">Fase de planejamento</div></div>
      ${statsHTML()}
      ${chronicleHTML()}
      <div class="actions">
        <div class="action-prompt">Escolha sua ação deste ciclo:</div>
        <div class="action-grid ${actions.length===3?'three':''}">
          ${actions.map(a=>`<button class="act" onclick="pickAction('${a}')">${ACTION_LABEL[a]}</button>`).join('')}
        </div>
      </div>`;
    return;
  }

  if(screen === 'siege-reveal'){
    const la = window._lastActions;
    app.innerHTML = `
      <div class="cycle-header"><div class="label">Cerco — ciclo ${state.cycle}</div><div class="phase">Revelação</div></div>
      ${statsHTML()}
      <div class="reveal-box">
        <div class="reveal-item troia"><div class="who">Troia</div><div class="act-name">${ACTION_LABEL[la.troia]}</div></div>
        <div class="reveal-item gregos"><div class="who">Gregos</div><div class="act-name">${ACTION_LABEL[la.gregos]}</div></div>
      </div>
      <div style="text-align:center;"><button class="advance" onclick="resolverCiclo()">Resolver o ciclo</button></div>
    `;
    return;
  }

  if(screen === 'fim'){
    const venceu = state.gameOver;
    const textos = {
      tropas: venceu==='troia' ? 'O exército grego se dissolveu por completo — sem homens, o cerco não pode continuar.' : 'A guarnição de Troia foi reduzida a nada — a cidade não tem mais quem a defenda.',
      moral: 'Sem vitórias suficientes para justificar mais um ano longe de casa, o acampamento grego se desfaz.'
    };
    app.innerHTML = `
      <div class="cycle-header"><div class="label">Ciclo ${state.cycle} — fim do cerco</div></div>
      ${statsHTML()}
      ${chronicleHTML()}
      <div class="endgame">
        <h2>${venceu==='troia' ? 'Troia resiste' : 'O cerco vence'}</h2>
        <p>${textos[state.reason]||''}</p>
        <button class="restart" onclick="novoDuelo()">Novo duelo</button>
      </div>`;
    return;
  }
}

render();
</script>
</body>
</html>
